name: CI

on:
  pull_request:
    branches: [main]
    paths: ["infra/airflow-gcp/**", "infra/gcp/etl/**", "data/dbt/**", "data/pipeline/**", "backend/**", "agent/**", "frontend/**", ".github/workflows/ci.yml"]
  push:
    branches: [main]
    paths: ["infra/airflow-gcp/**", "infra/gcp/etl/**", "data/dbt/**", "data/pipeline/**", "backend/**", "agent/**", "frontend/**", ".github/workflows/ci.yml"]

# The default token is read-only; a job that needs more says so itself.
permissions:
  contents: read

jobs:
  pipeline:
    name: Pipeline stages (tests against a real Postgres) and the GCP Airflow image
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_PASSWORD: pw
          POSTGRES_DB: data
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres -d data"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - name: Unit and Postgres integration tests of data/pipeline
        working-directory: data/pipeline
        env:
          PG_TEST_HOST: 127.0.0.1
          PG_TEST_PORT: "5432"
        run: |
          uv venv
          uv pip install -e ".[test]" psycopg2-binary
          .venv/bin/python -m pytest -q
      - name: Build the GCP Airflow image (sanity check only, not pushed anywhere)
        run: docker build . -f infra/airflow-gcp/Dockerfile -t airflow-gcp-ci-check
      - name: The DAG must import without errors, with the real Airflow
        run: >
          docker run --rm -e AIRFLOW__CORE__LOAD_EXAMPLES=False -e PYTHONPATH=/opt/airflow/dags --entrypoint python airflow-gcp-ci-check -c
          "from airflow.models import DagBag; bag = DagBag('/opt/airflow/dags');
          print(bag.import_errors or 'no import errors'); print(sorted(bag.dags));
          assert not bag.import_errors and 'latam_bank_gcp' in bag.dags"
      - name: Build the ETL job image
        run: docker build . -f infra/gcp/etl/Dockerfile -t etl-ci-check
      # Gate: a CRITICAL vulnerability that already has a fix fails the build. Ones without a fix
      # cannot be acted on (the Debian base has several), so they would only block every build.
      - name: Trivy, the Airflow image (critical and fixable)
        run: >
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock aquasec/trivy:latest
          image airflow-gcp-ci-check --severity CRITICAL --ignore-unfixed --exit-code 1 --scanners vuln,secret
      - name: Trivy, the ETL image (critical and fixable)
        run: >
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock aquasec/trivy:latest
          image etl-ci-check --severity CRITICAL --ignore-unfixed --exit-code 1 --scanners vuln,secret

  security:
    name: Security scans (Checkov, Trivy)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - name: Checkov, Dockerfiles and workflows (new findings fail; known ones are in .checkov.baseline)
        run: |
          uv venv /tmp/checkov-venv
          uv pip install --python /tmp/checkov-venv/bin/python checkov
          /tmp/checkov-venv/bin/checkov
      - name: Trivy, infrastructure configuration (HIGH and CRITICAL)
        run: >
          docker run --rm -v "$PWD:/src" aquasec/trivy:latest config /src
          --severity HIGH,CRITICAL --ignorefile /src/.trivyignore.yaml
          --skip-dirs /src/frontend/node_modules --exit-code 1
      - name: Trivy, secrets committed to the repository
        run: >
          docker run --rm -v "$PWD:/src" aquasec/trivy:latest fs /src --scanners secret
          --skip-dirs /src/frontend/node_modules --exit-code 1

  backend:
    name: Build the backend image and run its tests
    runs-on: ubuntu-latest
    # The SQL (migrations, paging, summary, lockout) is tested against a real PostgreSQL: the in-memory fake the
    # route tests use runs none of it, and it hid two bugs that only the real database showed.
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_PASSWORD: ci
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - name: Build image (tests ship inside)
        run: docker build . -f backend/Dockerfile -t backend-ci-check
      - name: pytest inside the image, against the PostgreSQL service
        run: >
          docker run --rm --network host -w /app
          -e SESSION_JWT_SECRET=ci-secret -e SESSION_TTL_MINUTES=120
          -e PG_TEST_HOST=localhost -e PG_TEST_PORT=5432 -e PG_TEST_USER=postgres -e PG_TEST_PASSWORD=ci
          backend-ci-check sh -c "pip install --no-cache-dir pytest httpx && python -m pytest -q"

  agent:
    name: Build the agent image and run its tests
    runs-on: ubuntu-latest
    # The conversation store's SQL (grouping, ordering, jsonb) runs against a real PostgreSQL, like the backend's.
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_PASSWORD: ci
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - name: Build image (tests ship inside, backend and LLM are faked)
        run: docker build . -f agent/Dockerfile -t agent-ci-check
      - name: pytest inside the image, against the PostgreSQL service
        run: >
          docker run --rm --network host -w /app
          -e SESSION_JWT_SECRET=ci-secret -e GUARDRAIL_MAX_USD=500
          -e PG_TEST_HOST=localhost -e PG_TEST_PORT=5432 -e PG_TEST_USER=postgres -e PG_TEST_PASSWORD=ci
          agent-ci-check sh -c "pip install --no-cache-dir pytest httpx && python -m pytest -q"

  frontend:
    name: Build the frontend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - name: Install dependencies
        working-directory: frontend
        run: pnpm install --frozen-lockfile
      - name: Build
        working-directory: frontend
        run: pnpm build
