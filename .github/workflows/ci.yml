name: CI

on:
  pull_request:
    branches: [main]
    paths: ["etl/**", "data/dbt/**"]
  push:
    branches: [main]
    paths: ["etl/**", "data/dbt/**"]

jobs:
  etl:
    name: Build the ETL image and parse the dbt project
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build image (sanity check only, not pushed anywhere)
        run: docker build . -f etl/Dockerfile -t etl-ci-check
      - name: dbt parse inside the image (every model, source and test must compile)
        run: docker run --rm -w /app/dbt etl-ci-check dbt parse --profiles-dir . --project-dir .
