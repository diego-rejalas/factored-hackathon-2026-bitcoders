name: GCP deploy

# Builds the images and applies infra/gcp/envs/<environment> with Terraform.
#
# - push to main: dev only, image build + terraform plan (nothing is pushed or applied)
# - workflow_dispatch: pick the environment (dev, qa, prod) and plan or apply, optionally run the ETL job
#
# Authentication is Workload Identity Federation: the job exchanges the OIDC token GitHub issues for it, so no
# key is stored. Plans run as a read-only service account; applies run as the deployment one, which only
# accepts workflows running on main (see infra/gcp/bootstrap).
#
# Needs in the repo (or per GitHub Environment, which lets prod require a manual approval):
#   vars: GCP_PROJECT_ID, GCP_STATE_BUCKET, GCP_REGION (default us-east4),
#         GCP_WORKLOAD_IDENTITY_PROVIDER, GCP_PLAN_SA, GCP_DEPLOY_SA (outputs of infra/gcp/bootstrap)
# The state bucket is created once with infra/gcp/scripts/setup-backend.sh.

on:
  push:
    branches: [main]
    paths: ["backend/**", "agent/**", "frontend/**", "data/dbt/**", "infra/gcp/**", ".github/workflows/gcp-deploy.yml"]
  workflow_dispatch:
    inputs:
      environment:
        description: "Environment"
        type: choice
        default: dev
        options: [dev, qa, prod]
      terraform_action:
        description: "Terraform action"
        type: choice
        default: plan
        options: [plan, apply]
      run_etl:
        description: "Run the ETL job after applying (S3 -> bronze -> gold in Cloud SQL)"
        type: boolean
        default: false

env:
  ENVIRONMENT: ${{ inputs.environment || 'dev' }}
  APPLY: ${{ github.event_name == 'workflow_dispatch' && inputs.terraform_action == 'apply' }}
  REGION: ${{ vars.GCP_REGION || 'us-east4' }}
  TAG: ${{ github.sha }}
  # Who may open the IAP tunnel to the Airflow VM, as a JSON list: a repository variable, so that no personal address
  # lives in the code and an apply from here does not remove the access an earlier apply granted.
  TF_VAR_airflow_admin_members: ${{ vars.AIRFLOW_ADMIN_MEMBERS || '[]' }}
  # Domains live in repository variables, not in the code. Empty: the load balancer keeps its <ip>.sslip.io name.
  TF_VAR_edge_domain: ${{ vars.EDGE_DOMAIN || '' }}
  TF_VAR_edge_additional_domains: ${{ vars.EDGE_ADDITIONAL_DOMAINS || '[]' }}

# The default token is read-only; a job that needs more says so itself.
permissions:
  contents: read

jobs:
  # Without the federation variables the deploy job is skipped instead of failing.
  gate:
    runs-on: ubuntu-latest
    outputs:
      ready: ${{ steps.check.outputs.ready }}
    steps:
      - id: check
        env:
          PROVIDER: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          PLAN_SA: ${{ vars.GCP_PLAN_SA }}
        run: echo "ready=$([ -n "$PROVIDER" ] && [ -n "$PLAN_SA" ] && echo true || echo false)" >> "$GITHUB_OUTPUT"

  deploy:
    name: Build images + Terraform (${{ inputs.environment || 'dev' }})
    needs: gate
    if: needs.gate.outputs.ready == 'true'
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment || 'dev' }}
    permissions:
      contents: read
      id-token: write # lets the job ask GitHub for the OIDC token that Google exchanges
    defaults:
      run:
        working-directory: infra/gcp/envs/${{ inputs.environment || 'dev' }}
    steps:
      - uses: actions/checkout@v4

      - id: auth
        uses: google-github-actions/auth@v2
        with:
          project_id: ${{ vars.GCP_PROJECT_ID }}
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          # Only an apply needs write access; every plan runs as the read-only account.
          service_account: ${{ env.APPLY == 'true' && vars.GCP_DEPLOY_SA || vars.GCP_PLAN_SA }}

      - uses: google-github-actions/setup-gcloud@v2

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.9.8

      - name: Terraform fmt (all environments and modules)
        working-directory: infra/gcp
        run: terraform fmt -check -recursive

      - name: Terraform init
        # The read-only account cannot write the state lock either, so a plan that will not be applied skips it.
        run: terraform init -backend-config="bucket=${{ vars.GCP_STATE_BUCKET }}" -input=false -lock=${{ env.APPLY == 'true' }}

      - name: Terraform validate
        run: terraform validate

      # The registry is created by Terraform, so it has to exist before the first image push.
      - name: Create the project APIs and the image registry
        if: env.APPLY == 'true'
        run: terraform apply -auto-approve -input=false -target=module.foundation -var "project_id=${{ vars.GCP_PROJECT_ID }}"

      - name: Build images (same Dockerfiles the services use locally)
        working-directory: .
        run: |
          BASE="${REGION}-docker.pkg.dev/${{ vars.GCP_PROJECT_ID }}/factored-${ENVIRONMENT}"
          docker build . -f backend/Dockerfile         -t "$BASE/backend:$TAG"
          docker build . -f agent/Dockerfile           -t "$BASE/agent:$TAG"
          docker build . -f infra/gcp/etl/Dockerfile   -t "$BASE/etl:$TAG"
          docker build . -f frontend/Dockerfile        -t "$BASE/frontend:$TAG"
          docker build . -f infra/gcp/airflow/Dockerfile -t "$BASE/airflow:$TAG"

      - name: Push images
        if: env.APPLY == 'true'
        working-directory: .
        run: |
          gcloud auth configure-docker ${REGION}-docker.pkg.dev --quiet
          BASE="${REGION}-docker.pkg.dev/${{ vars.GCP_PROJECT_ID }}/factored-${ENVIRONMENT}"
          for img in backend agent etl frontend airflow; do docker push "$BASE/$img:$TAG"; done

      - name: Terraform plan
        # The read-only account cannot take the state lock, so a plan that will not be applied skips it.
        run: terraform plan -input=false -lock=${{ env.APPLY == 'true' }} -var "image_tag=$TAG" -var "project_id=${{ vars.GCP_PROJECT_ID }}" -out=tfplan

      # Checkov cannot evaluate dynamic blocks or conditionals in the source, so Terraform is judged on the
      # resolved plan. The skips (each with its reason) are the ones in .checkov.yaml.
      - name: Checkov on the resolved plan
        run: |
          terraform show -json tfplan > "$RUNNER_TEMP/plan.json"
          pip install --quiet checkov
          SKIPS=$(grep -E '^\s+- (CKV[A-Z0-9_]+)' "$GITHUB_WORKSPACE/.checkov.yaml" | grep -oE 'CKV[A-Z0-9_]+' | paste -sd,)
          checkov -f "$RUNNER_TEMP/plan.json" --framework terraform_plan --skip-check "$SKIPS" --compact --quiet

      - name: Terraform apply
        if: env.APPLY == 'true'
        run: terraform apply -auto-approve -input=false tfplan

      - name: URLs of the stack
        if: env.APPLY == 'true'
        run: |
          echo "frontend: $(terraform output -raw frontend_uri)"
          echo "agent:    $(terraform output -raw agent_uri)"
          echo "backend:  $(terraform output -raw backend_uri)"
          echo "sql:      $(terraform output -raw cloudsql_connection_name)"

      - name: Run the ETL job (S3 -> bronze -> gold in Cloud SQL)
        if: env.APPLY == 'true' && inputs.run_etl
        run: |
          JOB=$(terraform output -raw etl_job)
          gcloud run jobs execute "$JOB" --region "$REGION" --project "${{ vars.GCP_PROJECT_ID }}" --wait
          gcloud run jobs executions list --job "$JOB" --region "$REGION" --project "${{ vars.GCP_PROJECT_ID }}" --limit 1

      - name: Health checks
        if: env.APPLY == 'true'
        run: |
          EDGE=$(terraform output -raw edge_url)
          LOCKDOWN=$(terraform output -raw edge_locked)
          if [ "$EDGE" != "null" ] && [ -n "$EDGE" ] && [ "$LOCKDOWN" = "true" ]; then
            # Through the load balancer: the path the browser takes. The certificate may still be provisioning.
            curl -fsS --retry 10 --retry-delay 30 -o /dev/null "$EDGE/"
            curl -fsS --retry 10 --retry-delay 30 "$EDGE/agent/health" | grep -q '"ok"'
          else
            curl -fsS "$(terraform output -raw agent_uri)/health" | grep -q '"ok"'
            curl -fsS -o /dev/null "$(terraform output -raw frontend_uri)"
          fi
          # The backend is closed to the internet: without credentials it must answer 403.
          test "$(curl -s -o /dev/null -w '%{http_code}' "$(terraform output -raw backend_uri)/health")" = "403"
          echo "stack healthy"
