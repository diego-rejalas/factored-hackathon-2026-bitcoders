# Trivy findings that are accepted or are limits of the scanner. Each one says why.
misconfigurations:
  # Trivy, like Checkov, cannot evaluate dynamic "database_flags" blocks, so it reports the Cloud SQL
  # logging flags as missing. They are set (qa, prod, dev: db_audit_logging = true); the resolved plan
  # shows them and Checkov passes the equivalent checks on it (spec/SECURITY_SCANS.md).
  - id: GCP-0014
    paths: ["infra/gcp/modules/cloudsql/main.tf"]
    statement: logging flags are set through a dynamic block that Trivy does not evaluate
  - id: GCP-0016
    paths: ["infra/gcp/modules/cloudsql/main.tf"]
    statement: same
  - id: GCP-0020
    paths: ["infra/gcp/modules/cloudsql/main.tf"]
    statement: same
  - id: GCP-0022
    paths: ["infra/gcp/modules/cloudsql/main.tf"]
    statement: same
  - id: GCP-0025
    paths: ["infra/gcp/modules/cloudsql/main.tf"]
    statement: same
  # Containers that run as root. The application images belong to the app team (tracked in the Checkov
  # baseline); infra/airflow is the Railway image, root on purpose so it can chown the mounted volume.
  - id: DS-0002
    paths: ["backend/Dockerfile", "agent/Dockerfile", "frontend/Dockerfile", "infra/airflow/Dockerfile", "infra/dbt/Dockerfile"]
    statement: not owned by this change; see .checkov.baseline and spec/SECURITY_SCANS.md
