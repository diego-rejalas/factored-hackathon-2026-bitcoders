name: 'latam_bank'
version: '1.0.0'
config-version: 2
profile: 'latam_bank'

model-paths: ["models"]
test-paths: ["tests"]
macro-paths: ["macros"]
target-path: "target"
clean-targets: ["target", "dbt_packages"]

models:
  latam_bank:
    # Descriptions go to Postgres comments (tables and columns) so psql and BI tools see them too.
    +persist_docs:
      relation: true
      columns: true
    staging:
      +materialized: view
      +schema: silver
    gold:
      +materialized: table
      +schema: gold
