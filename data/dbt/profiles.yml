latam_bank:
  target: prod
  outputs:
    prod:
      type: duckdb
      path: "{{ env_var('DUCKDB_PATH', '/tmp/latam.duckdb') }}"
      schema: silver
      threads: "{{ env_var('DUCKDB_THREADS', '4') | as_number }}"
      settings:
        memory_limit: "{{ env_var('DUCKDB_MEMORY_LIMIT', '8GB') }}"
        temp_directory: /tmp/duckdb_tmp
    postgres:
      type: postgres
      host: "{{ env_var('DBT_PG_HOST') }}"
      port: "{{ env_var('DBT_PG_PORT', '5432') | as_number }}"
      user: "{{ env_var('DBT_PG_USER') }}"
      password: "{{ env_var('DBT_PG_PASSWORD') }}"
      dbname: "{{ env_var('DBT_PG_DATABASE') }}"
      schema: silver
      threads: 4
