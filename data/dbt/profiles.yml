latam_bank:
  target: prod
  outputs:
    prod:
      type: duckdb
      # The file is built from scratch by etl/run.py (S3 -> bronze) right before
      # dbt runs; it never needs to outlive the job.
      path: "{{ env_var('DUCKDB_PATH', '/tmp/latam.duckdb') }}"
      # Default schema for anything without an explicit +schema. Every model sets
      # its own (silver/gold) via generate_schema_name; bronze is written by the
      # loader and dbt only reads it.
      schema: silver
      threads: 8
      settings:
        memory_limit: "{{ env_var('DUCKDB_MEMORY_LIMIT', '12GB') }}"
        temp_directory: /tmp/duckdb_tmp
