latam_bank:
  target: prod
  outputs:
    prod:
      type: postgres
      host: "{{ env_var('DBT_PG_HOST') }}"
      port: "{{ env_var('DBT_PG_PORT', '5432') | as_number }}"
      user: "{{ env_var('DBT_PG_USER') }}"
      password: "{{ env_var('DBT_PG_PASSWORD') }}"
      dbname: "{{ env_var('DBT_PG_DATABASE') }}"
      # Default schema for anything without an explicit +schema (dbt artifacts).
      # Every model sets its own (silver/gold) via generate_schema_name, and
      # bronze belongs to the loader: dbt only ever reads it.
      schema: silver
      threads: 4
