- name: stg_digital_events
  description: >-
    Clickstream events of the bank's mobile apps and web (page views, clicks, logins, form submissions,
    errors and purchases) grouped by session.


    **Grain:** One row per digital event.


    **Primary key:** `event_id`.


    **Source:** Organizer-provided synthetic LATAM Bank dataset (v1.0.0, CSV files on S3), loaded as `bronze.digital_events`.
    This silver model is a typed view over bronze: real data types, empty strings turned into NULL, and
    'Mexico' conformed to 'México'.


    **Coverage:** 15,620,994 events from 2023-06-17 06:02:03 to 2026-06-18 06:04:05 in 1,837,415 sessions,
    one source file per day. Event types: PageView 5,972,564, Click 3,585,034, Login 2,434,770, Logout
    2,433,612, FormSubmit 596,908, Error 358,723, Purchase 239,383. The organizer summary announces about
    10 million events; 56% more were loaded.


    **How we use it:** Context only (did the customer try to solve the issue in the app before calling).
    The rate of an error event followed by a call-center contact is 0% to 2.2% (spec/DATA_FINDINGS.md),
    so there is no causal chain to exploit.
  meta:
    layer: silver
    grain: one row per digital event
    primary_key: event_id
    source_dataset: LATAM Bank synthetic dataset v1.0.0 (organizer-provided)
    contains_pii: true
    data_quality:
    - >-
      customer_id is NULL in 24.0% of events (3,745,446 events, 865,829 anonymous sessions); a session
      never maps to more than one customer.
    - ip_country has both 'Mexico' and 'México' in the source; silver conforms it to 'México'.
    - >-
      Null patterns follow the event type: event_value only for FormSubmit and Purchase, product_id only
      for Click and PageView (9.2% of rows), duration_seconds only for PageView; referrer and utm_* are
      NULL in about 94%.
    - >-
      browser is NULL on every app channel and app_version on every web channel; platform and ip_address
      are NULL in 5.0% of rows.
    - event_value carries no currency indicator.
  columns:
  - name: event_id
    description: Primary key of the event. Format `EVT-` followed by 20 uppercase alphanumeric characters.
    data_tests:
    - not_null
    - unique
  - name: event_date
    description: Date and time of the event, from 2023-06-17 06:02:03 to 2026-06-18 06:04:05. {{ doc("ts_no_tz")
      }}
  - name: process_date
    description: '{{ doc("process_date_partition") }}'
  - name: customer_id
    description: >-
      Customer who generated the event, when the session was authenticated. References customers.customer_id.
      NULL in 24.0% of events (anonymous sessions, 865,829 of 1,837,415).
    data_tests:
    - relationships:
        arguments:
          to: ref('stg_customers')
          field: customer_id
  - name: session_id
    description: >-
      Session the event belongs to. Format `SES-` followed by 32 characters. 1,837,415 distinct sessions;
      a session has one customer, one IP address and one channel.
  - name: event_type
    description: >-
      Kind of event: `PageView` 5,972,564, `Click` 3,585,034, `Login` 2,434,770, `Logout` 2,433,612, `FormSubmit`
      596,908, `Error` 358,723, `Purchase` 239,383.
    data_tests:
    - accepted_values:
        arguments:
          values:
          - Click
          - Error
          - FormSubmit
          - Login
          - Logout
          - PageView
          - Purchase
  - name: event_category
    description: >-
      Functional area of the event: `Authentication` 4,868,382, `Navigation` 3,961,324, `Product` 3,786,314,
      `Transaction` 3,004,974.
    data_tests:
    - accepted_values:
        arguments:
          values:
          - Authentication
          - Navigation
          - Product
          - Transaction
  - name: channel
    description: >-
      Digital channel: `Android App` 5,476,164, `iOS App` 3,899,497, `Desktop Web` 3,128,851, `Mobile
      Web` 3,116,482.
    data_tests:
    - accepted_values:
        arguments:
          values:
          - Android App
          - Desktop Web
          - iOS App
          - Mobile Web
  - name: platform
    description: >-
      Operating system of the device: `Android` 6,685,963, `iOS` 5,182,421, `Windows` 991,807, `Linux`
      991,774, `MacOS` 988,502. NULL in 5.0%.
  - name: browser
    description: >-
      Web browser: `Safari` 1,728,968, `Chrome` 1,725,978, `Samsung Internet` 990,164, `Firefox` 744,247,
      `Edge` 743,901. NULL on all app channels (62.0% of events).
  - name: app_version
    description: >-
      Version of the mobile app, for example '3.8.1' (500 distinct values). NULL on web channels (43.0%
      of events).
  - name: page_url
    description: >-
      Path of the page or screen, 12 distinct values such as /login, /logout, /home, /accounts, /transactions,
      /payments, /transfer, /products/loans. NULL in 5.0%.
  - name: page_title
    description: >-
      Title of the page, in Spanish, for the same 12 pages as `page_url` (for example 'Iniciar Sesión'
      for /login, 'Mis Movimientos' for /transactions). NULL in 5.0%.
  - name: action
    description: >-
      Action performed, 10 distinct values: `view_product` 3,407,643, `logout` 2,191,640, `login` 2,189,929,
      `initiate_payment` 902,225, `initiate_transfer` 901,824, `view_transactions` 901,039, `view_accounts`
      892,802, `view_products` 891,777, `view_help` 890,625, `view_home` 890,058. NULL in 10.0%.
  - name: element_id
    description: >-
      Interface element involved, 12 distinct values such as login_form, logout_btn, payment_form, transfer_form.
      NULL in 15.0%.
  - name: product_id
    description: >-
      {{ doc("product_id_fk") }} Product involved in the event. Populated only for Click and PageView
      events (9.2% of rows); NULL otherwise.
    data_tests:
    - relationships:
        arguments:
          to: ref('stg_products')
          field: product_id
  - name: event_value
    description: >-
      Monetary value of the event, from 10.01 to 4,999.98; the currency is not stated. Populated only
      for FormSubmit and Purchase events; NULL in 94.9%.
  - name: duration_seconds
    description: >-
      Seconds the user stayed on the page, integer from 5 to 300. Populated only for PageView events;
      NULL in 63.7%.
  - name: ip_address
    description: >-
      IPv4 address of the client. One address per session (1,836,678 distinct values). NULL in 5.0%. {{
      doc("pii_synthetic") }}
    meta:
      contains_pii: true
  - name: ip_country
    description: >-
      {{ doc("country_name") }} Country resolved from the IP address: México 7,281,067, Colombia 4,806,882,
      Argentina 3,533,045. Conformed from 'Mexico' and 'México'.
    data_tests:
    - accepted_values:
        arguments:
          values:
          - México
          - Colombia
          - Argentina
  - name: ip_city
    description: >-
      City resolved from the IP address, 16 distinct values (the same cities as customers.city). NULL
      in 28.0%.
  - name: is_mobile
    description: >-
      Whether the device is mobile (app channels plus Mobile Web): `true` 12,492,143, `false` 3,128,851
      (Desktop Web).
  - name: referrer
    description: >-
      Referring site: `https://www.instagram.com` 262,214, `https://email.marketing.com` 262,107, `https://www.google.com`
      261,610, `https://www.facebook.com` 261,594. NULL in 93.3%.
  - name: utm_source
    description: >-
      UTM traffic source: `email` 210,149, `direct` 209,721, `google` 209,669, `facebook` 209,506. NULL
      in 94.6%.
  - name: utm_medium
    description: 'UTM medium: `organic` 210,210, `email` 209,778, `social` 209,627, `cpc` 209,519. NULL
      in 94.6%.'
  - name: utm_campaign
    description: >-
      UTM campaign tag: `retention` 280,033, `spring_promo` 279,962, `new_users` 278,922. It does not
      reference marketing_campaigns.campaign_id. NULL in 94.6%.
