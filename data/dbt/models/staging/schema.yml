          values:
          - México
          - Colombia
          - Argentina
  - name: ip_city
    description: Ciudad estimada por IP.
  - name: is_mobile
    description: El evento ocurrió desde un dispositivo móvil.
  - name: referrer
    description: Origen de la visita.
  - name: utm_source
    description: Parámetro UTM de origen.
  - name: utm_medium
    description: Parámetro UTM de medio.
  - name: utm_campaign
    description: Parámetro UTM de campaña.
