    description: Respuesta a la pregunta 1.
  - name: question_2_text
    description: Texto de la pregunta 2.
  - name: question_2_response
    description: Respuesta a la pregunta 2.
  - name: question_3_text
    description: Texto de la pregunta 3.
  - name: question_3_response
    description: Respuesta a la pregunta 3.
  - name: open_comments
    description: Comentarios del cliente al abrir el reclamo.
  - name: comment_sentiment
    description: Sentimiento del comentario del cliente.
