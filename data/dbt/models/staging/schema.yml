- name: stg_digital_events
  description: Eventos digitales. customer_id nulo en ~24% (sesiones anónimas, no es un error). ip_country se conforma a 'México'.
  columns:
  - name: event_id
    description: Identificador único del evento digital.
    data_tests:
    - not_null
    - unique
  - name: event_date
    description: Fecha y hora del evento digital.
  - name: process_date
    description: Fecha en que el banco procesó la transacción (nunca posterior a un día de la transacción).
  - name: customer_id
    description: Identificador del cliente (clave en customers; referencia en el resto de tablas).
    data_tests:
    - relationships:
        arguments:
          to: ref('stg_customers')
          field: customer_id
  - name: session_id
    description: Identificador de la sesión digital en la que ocurrió el evento.
  - name: event_type
    description: Tipo de evento digital.
    data_tests:
    - accepted_values:
        arguments:
          values:
          - Click
          - Error
          - FormSubmit
          - Login
          - Logout
          - PageView
          - Purchase
  - name: event_category
    description: Categoría del evento digital.
    data_tests:
    - accepted_values:
        arguments:
          values:
          - Authentication
          - Navigation
          - Product
          - Transaction
  - name: channel
    description: Canal digital del evento.
    data_tests:
    - accepted_values:
        arguments:
          values:
          - Android App
          - Desktop Web
          - iOS App
          - Mobile Web
  - name: platform
    description: Plataforma (web, iOS, Android).
  - name: browser
    description: Navegador utilizado.
  - name: app_version
    description: Versión de la aplicación.
  - name: page_url
    description: URL de la página visitada.
  - name: page_title
    description: Título de la página visitada.
  - name: action
    description: Acción realizada en el evento digital.
  - name: element_id
    description: Identificador del elemento de interfaz con el que se interactuó.
  - name: product_id
    description: Identificador del producto bancario (clave en products).
    data_tests:
    - relationships:
        arguments:
          to: ref('stg_products')
          field: product_id
  - name: event_value
    description: Valor asociado al evento.
  - name: duration_seconds
    description: Duración en segundos.
  - name: ip_address
    description: Dirección IP del evento.
  - name: ip_country
    description: País estimado por IP.
