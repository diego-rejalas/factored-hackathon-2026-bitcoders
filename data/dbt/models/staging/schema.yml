version: 2
models:
- name: stg_customers
  description: Retail customers of the bank (identity, contact, demographic and credit-profile attributes). One
    row per customer; primary key `customer_id`. Profile lookup for the authenticated customer and source of the
    credit-profile inputs; every other table references `customer_id`.
  meta:
    layer: silver
    grain: one row per customer
    primary_key: customer_id
    source_dataset: LATAM Bank synthetic dataset v1.0.0 (organizer-provided)
    contains_pii: true
    data_quality:
    - 'registration_branch_id does not join to branches (test: relationships, warn). Do not use it.'
    - credit_score minimum is above the documented range; covered by the accepted_range test.
    - last_updated can be later than the snapshot end.
    - estimated_monthly_income has no currency; it follows the customer's local currency, so it is not comparable
      across countries without conversion.
    - gender, marital_status and occupation are almost evenly distributed, typical of synthetic generation.
  columns:
  - name: customer_id
    description: Primary key. Format `CLI-` followed by 12 uppercase alphanumeric characters; referenced by every
      other table.
    data_tests:
    - not_null
    - unique
  - name: document_number
    description: National identity document number as text; format depends on `document_type` and country. Unique.
      {{ doc("pii_synthetic") }}
    meta:
      contains_pii: true
  - name: document_type
    description: 'Identity document kind: `DNI` national ID, `CE` foreign resident card, `Pasaporte` passport, `CC`
      Colombian citizen ID. CE, Pasaporte and CC appear only for Colombian customers.'
    data_tests:
    - accepted_values:
        arguments:
          values:
          - DNI
          - CE
          - Pasaporte
          - CC
  - name: first_name
    description: Given name or names in one string. {{ doc("pii_synthetic") }}
    meta:
      contains_pii: true
  - name: last_name
    description: Surnames in one string, normally two in Spanish order. {{ doc("pii_synthetic") }}
    meta:
      contains_pii: true
  - name: date_of_birth
    description: Date of birth. {{ doc("pii_synthetic") }}
    meta:
      contains_pii: true
  - name: gender
    description: 'Declared gender: `F` female, `M` male, `O` not defined in the dataset documentation (presumably
      other).'
    data_tests:
    - accepted_values:
        arguments:
          values:
          - F
          - O
          - M
  - name: email
    description: Email address. NULL when not provided. {{ doc("pii_synthetic") }}
    meta:
      contains_pii: true
  - name: mobile_phone
    description: Mobile number in international format with country prefix. NULL when not provided. {{ doc("pii_synthetic")
      }}
    meta:
      contains_pii: true
  - name: landline_phone
    description: Landline number in international format. NULL when not provided. {{ doc("pii_synthetic") }}
    meta:
      contains_pii: true
  - name: address
    description: Street address in one string (street, number, neighbourhood). NULL when not provided. {{ doc("pii_synthetic")
      }}
    meta:
      contains_pii: true
  - name: city
    description: 'City of residence (16 cities: six in México, five each in Colombia and Argentina).'
  - name: state
    description: State, department or province; one to one with `city`.
  - name: country
    description: '{{ doc("country_name") }}'
    data_tests:
    - accepted_values:
        arguments:
          values:
          - México
          - Colombia
          - Argentina
  - name: postal_code
    description: Postal code as text. NULL when not provided. {{ doc("pii_synthetic") }}
    meta:
      contains_pii: true
  - name: detected_accent
    description: 'Regional accent of the customer''s voice from contact-center speech analysis: `mexican`, `colombian`,
      `argentine`. NULL when no call was analysed.'
    data_tests:
    - accepted_values:
        arguments:
          values:
          - mexican
          - colombian
          - argentine
  - name: segment
    description: 'Commercial segment: `Basic`, `Plus`, `Premium`, `Student`. The defining criteria are not documented.'
    data_tests:
    - accepted_values:
        arguments:
          values:
          - Basic
          - Plus
          - Premium
          - Student
  - name: credit_score
    description: Credit score (integer; scale not documented, higher is better by convention). NULL means no score,
      not zero. No predictive relationship with delinquency in this dataset.
    data_tests:
    - accepted_range:
        arguments:
          min_value: 300
          max_value: 850
  - name: estimated_monthly_income
    description: Estimated monthly income in the currency of the customer's country (currency not stated, so not
      comparable across countries). NULL when unknown.
  - name: occupation
    description: Occupation label in English (for example Manager, Accountant, Doctor, Student, Retired). NULL when
      not provided.
  - name: marital_status
    description: 'Marital status: `Married`, `Divorced`, `Single`, `Widowed`. NULL when not provided.'
    data_tests:
    - accepted_values:
        arguments:
          values:
          - Married
          - Divorced
          - Single
          - Widowed
  - name: education_level
    description: 'Highest education level: `College Prep`, `High School`, `University`, `Graduate`, `Elementary`.
      NULL when not provided.'
    data_tests:
    - accepted_values:
        arguments:
          values:
          - College Prep
          - High School
          - University
          - Graduate
          - Elementary
  - name: registration_date
    description: When the customer registered with the bank. {{ doc("ts_no_tz") }}
  - name: registration_branch_id
    description: 'Branch where the customer registered. Do not use: values do not exist in branches (test: relationships,
      warn). Format `SUC-` followed by 8 characters.'
    data_tests:
    - relationships:
        arguments:
          to: ref('stg_branches')
          field: branch_id
        config:
          severity: warn
  - name: customer_status
    description: 'Lifecycle status: `Active`, `Inactive`, `Suspended`, `Closed`.'
    data_tests:
    - accepted_values:
        arguments:
          values:
          - Active
          - Inactive
          - Suspended
          - Closed
  - name: last_updated
    description: When the customer record was last modified; can be later than the snapshot end. {{ doc("ts_no_tz")
      }}
  - name: accepts_marketing
    description: Whether the customer consented to marketing communications. Check before any outbound contact.
- name: stg_products
  description: Bank products held by customers (accounts, cards, loans, investments, insurance). One row per product;
    primary key `product_id`. Used to resolve which products a customer owns and to read balances, limits and status.
  meta:
    layer: silver
    grain: one row per product held by a customer
    primary_key: product_id
    source_dataset: LATAM Bank synthetic dataset v1.0.0 (organizer-provided)
    data_quality:
    - currency is never MXN, even for Mexican customers (all of them appear in USD); balances are not comparable
      across currencies.
    - 'Some credit products have current_balance above credit_limit (test: assert_credit_balance_within_limit, warn).'
    - credit_limit and days_past_due are NULL for non-credit products; NULL is not zero.
    - days_past_due takes a handful of discrete values and carries no predictive signal of delinquency.
    - last_updated can be later than the snapshot end.
    - product_number is not unique; use product_id.
  columns:
  - name: product_id
    description: Primary key. Format `PRD-` followed by 12 uppercase alphanumeric characters; referenced by transactions,
      complaints and digital_events.
    data_tests:
    - not_null
    - unique
  - name: customer_id
    description: Owner of the product (one owner per product). References customers.customer_id.
    data_tests:
    - not_null
    - relationships:
        arguments:
          to: ref('stg_customers')
          field: customer_id
  - name: product_type
    description: 'Kind of product (Spanish labels as delivered): `Cuenta Ahorro` savings account, `Cuenta Corriente`
      checking account, `Tarjeta Crédito` credit card, `Tarjeta Débito` debit card, `Préstamo Personal` personal
      loan, `Préstamo Hipotecario` mortgage, `Inversión` investment, `Seguro` insurance. Credit products are the
      credit card and the two loans.'
    data_tests:
    - accepted_values:
        arguments:
          values:
          - Cuenta Ahorro
          - Cuenta Corriente
          - Tarjeta Crédito
          - Tarjeta Débito
          - Préstamo Personal
          - Préstamo Hipotecario
          - Inversión
          - Seguro
  - name: product_number
    description: Customer-visible account or card number as text (fictitious). Not unique; use product_id.
  - name: currency
    description: 'ISO 4217 currency of `current_balance` and `credit_limit`: `USD`, `COP`, `ARS`. Never `MXN`, even
      for México customers.'
    data_tests:
    - accepted_values:
        arguments:
          values:
          - USD
          - COP
          - ARS
  - name: current_balance
    description: Current balance in the product currency; sign convention not documented. Not comparable across
      currencies.
  - name: credit_limit
    description: Credit limit in the product currency. NULL for non-credit products, where it does not apply.
    data_tests:
    - accepted_range:
        arguments:
          min_value: 0
  - name: interest_rate
    description: Interest rate as a percentage number; the period (annual or monthly) is not documented. NULL when
      unknown.
  - name: opening_date
    description: Date the product was opened.
  - name: expiration_date
    description: Card expiration date. NULL for products that are not cards.
  - name: opening_branch_id
    description: '{{ doc("branch_id_fk") }} Branch where the product was opened.'
    data_tests:
    - relationships:
        arguments:
          to: ref('stg_branches')
          field: branch_id
  - name: product_status
    description: 'Status: `Active`, `Closed`, `Blocked`, `Suspended`. `Blocked` products are the basis of card-blocked
      scenarios.'
    data_tests:
    - accepted_values:
        arguments:
          values:
          - Active
          - Closed
          - Blocked
          - Suspended
  - name: opening_channel
    description: 'Channel through which the product was opened: `Branch`, `Web`, `App`, `Call Center`.'
    data_tests:
    - accepted_values:
        arguments:
          values:
          - Branch
          - Web
          - App
          - Call Center
  - name: has_linked_app
    description: Whether the product is linked to the mobile app (meaning inferred from the name; not documented).
  - name: days_past_due
    description: Days the payment is overdue, in discrete steps (0, 15, 30, 60, 90, 120, 180). NULL for non-credit
      products and some credit products; NULL is not zero.
    data_tests:
    - accepted_values:
        arguments:
          values:
          - '0'
          - '90'
          - '30'
          - '15'
          - '60'
          - '180'
          - '120'
        config:
          severity: warn
  - name: last_transaction_date
    description: When the last transaction on the product happened. NULL when none is recorded. {{ doc("ts_no_tz")
      }}
  - name: last_updated
    description: When the product record was last modified; can be later than the snapshot end. {{ doc("ts_no_tz")
      }}
- name: stg_transactions
  description: Card and account transactions (purchases, withdrawals, transfers, payments, deposits, adjustments).
    One row per transaction; primary key `transaction_id`. Basis of the dispute workflow. Silver additionally carries
    the fraud ground-truth columns, which are excluded from gold.
  meta:
    layer: silver
    grain: one row per transaction
    primary_key: transaction_id
    source_dataset: LATAM Bank synthetic dataset v1.0.0 (organizer-provided)
    data_quality:
    - 'amount_usd is NULL for all USD rows and for some ARS and COP rows (test: assert_usd_amount_present_for_non_usd_transactions,
      warn); derive it with daily_exchange_rates.'
    - currency is never MXN; Mexican customers always transact in USD, always in the currency of the product.
    - transaction_country spells Mexico two ways ('México' and 'Mexico') and is not conformed in silver.
    - Declined codes are spread evenly and independent of the product; a decline is explained only by its response_code.
    - transaction_category and merchant_name are empty for Transfer, Withdrawal, Deposit and Adjustment.
    - latitude and longitude are mostly NULL and many values are close to zero; not usable as geolocation.
    - 'process_date is the transaction date or one day earlier (test: assert_transactions_processed_within_a_day_of_event,
      warn); there are no late arrivals.'
    - is_fraud and fraud_score are evaluation ground truth, never an agent input; excluded from gold.
  columns:
  - name: transaction_id
    description: Primary key. Format `TRX-` followed by 20 uppercase alphanumeric characters.
    data_tests:
    - not_null
    - unique
  - name: transaction_date
    description: When the transaction took place. {{ doc("ts_no_tz") }}
  - name: process_date
    description: '{{ doc("process_date_partition") }} Equals the date of `transaction_date` or one day earlier,
      never later (test: assert_transactions_processed_within_a_day_of_event, warn).'
  - name: product_id
    description: '{{ doc("product_id_fk") }} Product the transaction was made on; owned by `customer_id` (test:
      assert_transactions_customer_owns_product).'
    data_tests:
    - not_null
    - relationships:
        arguments:
          to: ref('stg_products')
          field: product_id
  - name: customer_id
    description: '{{ doc("customer_id_fk") }} Owner of the product.'
    data_tests:
    - not_null
    - relationships:
        arguments:
          to: ref('stg_customers')
          field: customer_id
  - name: transaction_type
    description: 'Kind of movement: `Purchase`, `Withdrawal`, `Transfer`, `Payment`, `Deposit`, `Adjustment`. The
      direction of the money comes from the type, not from the sign of `amount`.'
    data_tests:
    - accepted_values:
        arguments:
          values:
          - Purchase
          - Withdrawal
          - Transfer
          - Payment
          - Deposit
          - Adjustment
  - name: transaction_category
    description: 'Spending category: `Food`, `Services`, `Other`, `Transport`, `Entertainment`, `Health`. NULL for
      Transfer, Withdrawal, Deposit and Adjustment, and for some Purchase and Payment rows.'
    data_tests:
    - accepted_values:
        arguments:
          values:
          - Food
          - Services
          - Other
          - Transport
          - Entertainment
          - Health
  - name: amount
    description: Amount in `currency` (the product currency), always positive. Not comparable across currencies;
      use `amount_usd` or daily_exchange_rates.
    data_tests:
    - accepted_range:
        arguments:
          min_value: 0.01
  - name: currency
    description: 'ISO 4217 currency of `amount`, always the product currency: `USD`, `COP`, `ARS`. Never `MXN`;
      México customers transact in USD.'
    data_tests:
    - accepted_values:
        arguments:
          values:
          - USD
          - COP
          - ARS
  - name: amount_usd
    description: 'Amount in US dollars. NULL for every USD row (use `amount`) and for some ARS and COP rows (test:
      assert_usd_amount_present_for_non_usd_transactions, warn); derive those with daily_exchange_rates.'
  - name: channel
    description: 'Channel used: `POS`, `ATM`, `Web`, `App`, `Branch`, `Transfer`.'
    data_tests:
    - accepted_values:
        arguments:
          values:
          - POS
          - ATM
          - Web
          - App
          - Branch
          - Transfer
  - name: branch_id
    description: '{{ doc("branch_id_fk") }} Branch of the transaction. Populated almost only for the `ATM` and `Branch`
      channels; NULL otherwise.'
    data_tests:
    - relationships:
        arguments:
          to: ref('stg_branches')
          field: branch_id
  - name: merchant_name
    description: Merchant name for card purchases (for example 'Mercado Central'). NULL for non-purchase types.
  - name: merchant_category
    description: Merchant category, same labels as `transaction_category`; the two often disagree on a row and which
      is authoritative is not documented. NULL when there is no merchant.
  - name: transaction_country
    description: 'Country of the transaction: `México`, `Colombia`, `Argentina`, `USA`, `Spain`, `Brazil`, and also
      the unconformed spelling `Mexico` (same country as `México`).'
    data_tests:
    - accepted_values:
        arguments:
          values:
          - México
          - Colombia
          - Argentina
          - USA
          - Spain
          - Mexico
          - Brazil
        config:
          severity: warn
  - name: transaction_city
    description: City of the transaction. NULL when not recorded.
  - name: transaction_status
    description: 'Authorization outcome: `Approved`, `Declined`, `Pending`, `Reversed`. Declined and Reversed are
      the basis of automatically resolvable dispute cases.'
    data_tests:
    - accepted_values:
        arguments:
          values:
          - Approved
          - Declined
          - Pending
          - Reversed
  - name: response_code
    description: 'Authorization response code: `00` approved, `05` do not honor, `14` invalid card number, `51`
      insufficient funds, `54` expired card (standard card-network meanings; the dataset does not define them).
      NULL when not recorded, including some Approved rows.'
    data_tests:
    - accepted_values:
        arguments:
          values:
          - '00'
          - '14'
          - '51'
          - '05'
          - '54'
        config:
          severity: warn
  - name: is_fraud
    description: '{{ doc("fraud_ground_truth") }}'
  - name: fraud_score
    description: '{{ doc("fraud_ground_truth") }} Score from 0 to 100, NULL when not scored; it leaks the label.'
  - name: latitude
    description: 'Latitude in decimal degrees. Mostly NULL and unreliable: many values are near zero and inconsistent
      with the country.'
  - name: longitude
    description: Longitude in decimal degrees. Mostly NULL and unreliable (see latitude).
- name: stg_complaints
  description: Customer complaints, claims, requests and suggestions (PQR cases). One row per case; primary key
    `complaint_id`. Case history and status source for the dispute workflow.
  meta:
    layer: silver
    grain: one row per registered case (PQR)
    primary_key: complaint_id
    source_dataset: LATAM Bank synthetic dataset v1.0.0 (organizer-provided)
    data_quality:
    - 'affected_product_id belongs to another customer (test: assert_complaint_affected_product_belongs_to_customer,
      warn). Never use it to show or authorize product information.'
    - origin_interaction_id is empty in every row, so no case links to a call-center interaction.
    - claimed_amount matches no transaction and is not scaled to its currency; not a usable dispute amount.
    - description and resolution are templated sentences, not free text; do not train intent classifiers on them.
    - subcategory is one to one with category and adds no granularity.
    - 'Some Resolved or Closed cases have no resolution_date (test: assert_resolved_complaints_have_resolution_date,
      warn).'
    - Outcomes (SLA breach, resolution time) do not differ by category.
    - resolution_date, closing_date and first_response_date can be later than the snapshot end.
    - currency includes MXN, the only table besides daily_exchange_rates where it appears.
  columns:
  - name: complaint_id
    description: Primary key. Format `CMP-` followed by 20 uppercase alphanumeric characters.
    data_tests:
    - not_null
    - unique
  - name: creation_date
    description: When the case was registered. {{ doc("ts_no_tz") }}
  - name: process_date
    description: '{{ doc("process_date_partition") }}'
  - name: customer_id
    description: '{{ doc("customer_id_fk") }} Customer who registered the case.'
    data_tests:
    - not_null
    - relationships:
        arguments:
          to: ref('stg_customers')
          field: customer_id
  - name: case_type
    description: 'Nature of the case: `Complaint`, `Claim`, `Request`, `Suggestion`.'
    data_tests:
    - accepted_values:
        arguments:
          values:
          - Complaint
          - Claim
          - Request
          - Suggestion
  - name: category
    description: 'Topic: `Transactions`, `Fees`, `Technical`, `Branch`, `Service`. With `subcategory` it is the
      real structured signal of the table.'
    data_tests:
    - accepted_values:
        arguments:
          values:
          - Transactions
          - Fees
          - Technical
          - Branch
          - Service
  - name: subcategory
    description: 'Detail of the topic, one label per category: `Cargo no reconocido` (unrecognised charge), `Cobro
      indebido` (improper charge), `Problema con app` (app problem), `Atención en sucursal` (branch service), `Calidad
      de servicio` (service quality). NULL when not set.'
    data_tests:
    - accepted_values:
        arguments:
          values:
          - Cargo no reconocido
          - Cobro indebido
          - Problema con app
          - Atención en sucursal
          - Calidad de servicio
        config:
          severity: warn
  - name: reception_channel
    description: 'Channel through which the case was received: `Call Center`, `Email`, `Web`, `App`, `Branch`, `Regulator`.'
    data_tests:
    - accepted_values:
        arguments:
          values:
          - Call Center
          - Email
          - Web
          - App
          - Branch
          - Regulator
  - name: affected_product_id
    description: 'Product the case refers to. Do not use: it belongs to another customer (test: assert_complaint_affected_product_belongs_to_customer,
      warn). Would reference products.product_id.'
  - name: related_branch_id
    description: '{{ doc("branch_id_fk") }} Branch the case relates to. NULL when none.'
    data_tests:
    - relationships:
        arguments:
          to: ref('stg_branches')
          field: branch_id
  - name: origin_interaction_id
    description: Interaction that originated the case. NULL in every row, so it cannot be used; would reference
      call_center_interactions.interaction_id.
  - name: description
    description: Templated text 'Queja relacionada con {category}' (complaint related to ...), one sentence per
      category. Not free text; do not use for intent classification.
  - name: claimed_amount
    description: Amount the customer claims, in `currency`. NULL when none. Matches no transaction and is not scaled
      to its currency; not a usable dispute amount.
  - name: currency
    description: 'ISO 4217 currency of `claimed_amount`: `MXN`, `COP`, `USD`, `ARS`. NULL when there is no claimed
      amount.'
    data_tests:
    - accepted_values:
        arguments:
          values:
          - MXN
          - COP
          - USD
          - ARS
  - name: priority
    description: 'Handling priority: `Medium`, `Low`, `High`, `Critical`.'
    data_tests:
    - accepted_values:
        arguments:
          values:
          - Medium
          - Low
          - High
          - Critical
  - name: status
    description: 'Handling status: `Open`, `In Process`, `Escalated`, `Resolved`, `Closed`, `Rejected`. Resolution,
      closing and satisfaction fields are populated only for Resolved and Closed cases.'
    data_tests:
    - accepted_values:
        arguments:
          values:
          - Open
          - In Process
          - Escalated
          - Resolved
          - Closed
          - Rejected
  - name: assigned_agent_id
    description: '{{ doc("agent_id_fk") }} Agent the case is assigned to. NULL when unassigned.'
    data_tests:
    - relationships:
        arguments:
          to: ref('stg_service_agents')
          field: agent_id
  - name: assignment_date
    description: When the case was assigned to an agent. NULL when unassigned. {{ doc("ts_no_tz") }}
  - name: first_response_date
    description: When the customer first got a response. NULL when none. {{ doc("ts_no_tz") }}
  - name: resolution_date
    description: 'When the case was resolved. Expected only for Resolved and Closed cases, but some lack it (test:
      assert_resolved_complaints_have_resolution_date, warn). {{ doc("ts_no_tz") }}'
  - name: closing_date
    description: When the case was closed. NULL unless Closed. {{ doc("ts_no_tz") }}
  - name: sla_breached
    description: Whether the service-level deadline was breached. The deadlines themselves are not in the dataset.
  - name: resolution_days
    description: Days the case took to resolve (integer). NULL for unresolved cases.
  - name: resolution
    description: Templated resolution sentence in Spanish (one of a few generic phrases). NULL for unresolved cases.
      Not free text.
  - name: compensation_granted
    description: Compensation granted to the customer; currency not stated. NULL unless Resolved or Closed with
      compensation.
  - name: resolution_satisfaction
    description: Customer satisfaction with the resolution, integer 1 (worst) to 5 (best). NULL unless Closed.
  - name: is_repeat_complainer
    description: Whether the customer has registered more than one case; the source rule is not documented.
- name: stg_call_center_interactions
  description: Contact-center interactions (calls, chats, emails, video). One row per interaction; primary key `interaction_id`.
    Interaction history of a customer, with reason, sentiment and outcome.
  meta:
    layer: silver
    grain: one row per contact-center interaction
    primary_key: interaction_id
    source_dataset: LATAM Bank synthetic dataset v1.0.0 (organizer-provided)
    data_quality:
    - contact_reason is identical to reason_category in every row; use one of the two.
    - Some interactions are marked both escalated and resolved (no test).
    - was_escalated is flat across contact reasons while resolution varies by reason.
    - duration_seconds, wait_time_seconds and both accent columns are partly NULL.
    - mentioned_products is a comma separated list of product IDs that is not validated against products.
    - has_transcript is true exactly for the rows present in call_transcripts.
  columns:
  - name: interaction_id
    description: Primary key. Format `INT-` followed by 16 uppercase alphanumeric characters; referenced one to
      one by call_transcripts and satisfaction_surveys.
    data_tests:
    - not_null
    - unique
  - name: interaction_date
    description: When the interaction started. {{ doc("ts_no_tz") }}
  - name: process_date
    description: '{{ doc("process_date_partition") }}'
  - name: customer_id
    description: '{{ doc("customer_id_fk") }} Customer who contacted or was contacted by the bank.'
    data_tests:
    - not_null
    - relationships:
        arguments:
          to: ref('stg_customers')
          field: customer_id
  - name: agent_id
    description: '{{ doc("agent_id_fk") }} Agent who handled the interaction.'
    data_tests:
    - relationships:
        arguments:
          to: ref('stg_service_agents')
          field: agent_id
  - name: interaction_type
    description: 'Type of contact: `Inbound Call`, `Outbound Call`, `Chat`, `Email`, `Video`.'
    data_tests:
    - accepted_values:
        arguments:
          values:
          - Inbound Call
          - Outbound Call
          - Chat
          - Email
          - Video
  - name: channel
    description: 'Channel used: `Phone`, `Email`, `App`, `WhatsApp`, `Web Chat`, `Web`. Not one to one with `interaction_type`.'
    data_tests:
    - accepted_values:
        arguments:
          values:
          - Phone
          - Email
          - App
          - WhatsApp
          - Web Chat
          - Web
  - name: contact_reason
    description: 'Reason for the contact (Spanish labels): `Transaccional` transactional, `Producto` product, `Queja`
      complaint, `Técnico` technical, `Comercial` commercial, `Retención` retention. Identical to `reason_category`;
      use one of the two.'
    data_tests:
    - accepted_values:
        arguments:
          values:
          - Transaccional
          - Producto
          - Queja
          - Técnico
          - Comercial
          - Retención
  - name: reason_category
    description: Category of the contact reason; same values as `contact_reason`.
    data_tests:
    - accepted_values:
        arguments:
          values:
          - Transaccional
          - Producto
          - Queja
          - Técnico
          - Comercial
          - Retención
  - name: duration_seconds
    description: Duration of the interaction in seconds. NULL when not recorded.
  - name: wait_time_seconds
    description: Seconds the customer waited before an agent answered. NULL when not recorded.
  - name: was_resolved
    description: Whether the issue was resolved in this interaction (first-contact resolution). Some rows are also
      escalated.
  - name: requires_followup
    description: Whether the interaction requires a follow-up contact.
  - name: detected_sentiment
    description: 'Customer sentiment (Spanish labels), consistent with `sentiment_score`: `Muy Negativo`, `Negativo`,
      `Neutral`, `Positivo`, `Muy Positivo`.'
    data_tests:
    - accepted_values:
        arguments:
          values:
          - Neutral
          - Negativo
          - Positivo
          - Muy Negativo
          - Muy Positivo
  - name: sentiment_score
    description: 'Sentiment score from -1.00 (very negative) to 1.00 (very positive); bands: very negative up to
      -0.70, negative up to -0.30, neutral up to 0.30, positive up to 0.70.'
  - name: customer_detected_accent
    description: 'Regional accent of the customer''s voice: `mexican`, `colombian`, `argentine`. NULL for non-voice
      contacts or no detection.'
    data_tests:
    - accepted_values:
        arguments:
          values:
          - mexican
          - colombian
          - argentine
  - name: agent_used_accent
    description: 'Regional accent the agent used: `mexican`, `colombian`, `argentine`. NULL for non-voice contacts.'
    data_tests:
    - accepted_values:
        arguments:
          values:
          - mexican
          - colombian
          - argentine
  - name: was_escalated
    description: Whether the interaction was escalated to another level or agent.
  - name: mentioned_products
    description: Product IDs mentioned, as one comma separated string (for example 'PRD-1SE86VVJ9G9H,PRD-4JF3EHW4I3VU').
      NULL when none. Not validated against products.
  - name: has_transcript
    description: Whether a transcript exists in call_transcripts.
  - name: has_recording
    description: Whether an audio recording exists (the recordings are not in the dataset).
- name: stg_branches
  description: Bank branches. One row per branch; primary key `branch_id`. Reference data for products, transactions
    and complaints.
  meta:
    layer: silver
    grain: one row per branch
    primary_key: branch_id
    source_dataset: LATAM Bank synthetic dataset v1.0.0 (organizer-provided)
    data_quality:
    - 'geographic_zone is constant; the documented values Suburban and Rural never appear (test: accepted_values,
      warn).'
    - has_atms and has_teller_windows are constant and carry no information.
    - Many latitude/longitude values are close to zero and invalid for the three countries; not usable for geolocation.
    - branch_ids in customers.registration_branch_id and service_agents.assigned_branch_id mostly do not exist here;
      products, transactions and complaints join without orphans.
  columns:
  - name: branch_id
    description: Primary key. Format `SUC-` followed by 8 uppercase alphanumeric characters (SUC is sucursal, branch).
    data_tests:
    - not_null
    - unique
  - name: branch_code
    description: Short branch code `S0001` to `S0350`, unique per branch.
  - name: branch_name
    description: Display name, for example 'Banco LATAM Tijuana Sur'. Not unique.
  - name: branch_type
    description: 'Branch format: `Express`, `Corporate`, `Premium`, `Main`.'
    data_tests:
    - accepted_values:
        arguments:
          values:
          - Corporate
          - Express
          - Main
          - Premium
  - name: address
    description: Street address of the branch.
  - name: city
    description: City of the branch.
  - name: state
    description: State, department or province of the branch.
  - name: country
    description: '{{ doc("country_name") }}'
    data_tests:
    - accepted_values:
        arguments:
          values:
          - México
          - Colombia
          - Argentina
  - name: postal_code
    description: Postal code of the branch.
  - name: geographic_zone
    description: Urban or rural classification. Always `Urbana` in practice; the documented Suburban and Rural never
      appear, so it does not discriminate.
    data_tests:
    - accepted_values:
        arguments:
          values:
          - Urbana
          - Suburban
          - Rural
        config:
          severity: warn
  - name: phone
    description: Branch phone number in international format (fictitious).
  - name: email
    description: Branch email address.
  - name: opening_time
    description: Time of day the branch opens (local time, no date).
  - name: closing_time
    description: Time of day the branch closes (local time, no date).
  - name: has_atms
    description: Whether the branch has ATMs. Constant in this dataset; no information.
  - name: atm_count
    description: Number of ATMs at the branch.
  - name: has_teller_windows
    description: Whether the branch has teller windows. Constant in this dataset; no information.
  - name: teller_window_count
    description: Number of teller windows.
  - name: latitude
    description: 'Latitude in decimal degrees. Not reliable: many branches are within one degree of zero (see data_quality).'
    data_tests:
    - accepted_range:
        arguments:
          min_value: -90
          max_value: 90
  - name: longitude
    description: Longitude in decimal degrees. Not reliable (see latitude).
    data_tests:
    - accepted_range:
        arguments:
          min_value: -180
          max_value: 180
  - name: branch_opening_date
    description: Date the branch opened.
  - name: branch_status
    description: 'Operating status: `Active`, `Temporarily Closed`.'
    data_tests:
    - accepted_values:
        arguments:
          values:
          - Active
          - Temporarily Closed
- name: stg_service_agents
  description: Customer-service agents. One row per agent; primary key `agent_id`. Reference data for interactions,
    transcripts, surveys and complaints.
  meta:
    layer: silver
    grain: one row per service agent
    primary_key: agent_id
    source_dataset: LATAM Bank synthetic dataset v1.0.0 (organizer-provided)
    contains_pii: true
    data_quality:
    - 'assigned_branch_id is NULL for remote and digital agents and mostly does not exist in branches (test: relationships,
      warn).'
    - Some agents speak Portuguese, but no customer, transcript or text in the dataset is in Portuguese.
    - country_of_origin is spelled 'Mexico' in the source; silver conforms it to 'México'.
    - specialty, avg_csat, total_monthly_interactions and phone are partly NULL.
    - employee_code is not unique; use agent_id.
  columns:
  - name: agent_id
    description: Primary key. Format `AGT-` followed by 10 uppercase alphanumeric characters.
    data_tests:
    - not_null
    - unique
  - name: employee_code
    description: HR employee code such as 'E23396'. Not unique; use agent_id.
  - name: first_name
    description: Given name of the agent. {{ doc("pii_synthetic") }}
    meta:
      contains_pii: true
  - name: last_name
    description: Surnames of the agent in one string. {{ doc("pii_synthetic") }}
    meta:
      contains_pii: true
  - name: email
    description: Work email address (fictitious domain). {{ doc("pii_synthetic") }}
    meta:
      contains_pii: true
  - name: phone
    description: Phone number in international format. NULL when not provided. {{ doc("pii_synthetic") }}
    meta:
      contains_pii: true
  - name: native_accent
    description: 'Regional accent of the agent: `mexican`, `colombian`, `argentine`; matches `country_of_origin`.'
    data_tests:
    - accepted_values:
        arguments:
          values:
          - argentine
          - colombian
          - mexican
  - name: country_of_origin
    description: '{{ doc("country_name") }} Country the agent comes from.'
    data_tests:
    - accepted_values:
        arguments:
          values:
          - México
          - Colombia
          - Argentina
  - name: assigned_branch_id
    description: '{{ doc("branch_id_fk") }} Branch the agent is assigned to. NULL for remote or digital agents.
      Do not use for joins: most values do not exist in branches (test: relationships, warn).'
    data_tests:
    - relationships:
        arguments:
          to: ref('stg_branches')
          field: branch_id
        config:
          severity: warn
  - name: agent_type
    description: 'Service modality: `Phone`, `Digital`, `In-Person`, `Hybrid`.'
    data_tests:
    - accepted_values:
        arguments:
          values:
          - Digital
          - Hybrid
          - In-Person
          - Phone
  - name: experience_level
    description: 'Seniority: `Junior`, `Mid-Senior`, `Senior`, `Specialist`.'
    data_tests:
    - accepted_values:
        arguments:
          values:
          - Junior
          - Mid-Senior
          - Senior
          - Specialist
  - name: languages
    description: 'Spoken languages as a Spanish comma separated list: `español`, `español, inglés`, `español, portugués`,
      `español, inglés, portugués`.'
    data_tests:
    - accepted_values:
        arguments:
          values:
          - español
          - español, inglés
          - español, portugués
          - español, inglés, portugués
        config:
          severity: warn
  - name: specialty
    description: 'Area of expertise (Spanish labels): `Fraudes` fraud, `Cobranza` collections, `Soporte Técnico`
      technical support, `Retención` retention, `Créditos` credit, `Inversiones` investments, `Ventas` sales, `Quejas
      y Reclamos` complaints and claims. NULL when unspecified.'
    data_tests:
    - accepted_values:
        arguments:
          values:
          - Fraudes
          - Cobranza
          - Soporte Técnico
          - Retención
          - Créditos
          - Inversiones
          - Ventas
          - Quejas y Reclamos
        config:
          severity: warn
  - name: hire_date
    description: Date the agent was hired.
  - name: avg_csat
    description: Average customer-satisfaction (CSAT) score; a 5-point scale is assumed (not documented). NULL when
      unavailable.
  - name: total_monthly_interactions
    description: Monthly number of interactions handled (integer); whether average or snapshot month is not documented.
      NULL when unavailable.
  - name: agent_status
    description: 'Employment status: `Active`, `Vacation`, `Leave`, `Inactive`.'
    data_tests:
    - accepted_values:
        arguments:
          values:
          - Active
          - Inactive
          - Leave
          - Vacation
  - name: work_shift
    description: 'Shift: `Afternoon`, `Morning`, `Rotating`, `Night`.'
    data_tests:
    - accepted_values:
        arguments:
          values:
          - Afternoon
          - Morning
          - Night
          - Rotating
- name: stg_marketing_campaigns
  description: 'Marketing campaigns. One row per campaign; primary key `campaign_id`. Outside the customer-service
    scope: documented but not exposed in gold.'
  meta:
    layer: silver
    grain: one row per marketing campaign
    primary_key: campaign_id
    source_dataset: LATAM Bank synthetic dataset v1.0.0 (organizer-provided)
    data_quality:
    - target_country is spelled 'Mexico' in the source; silver conforms it to 'México'.
    - target_country, target_segment, description, budget, promoted_product and expected_conversion_rate are partly
      NULL.
    - budget has no currency.
    - description mixes English and Spanish.
  columns:
  - name: campaign_id
    description: Primary key. Format `CMP-` followed by 12 uppercase alphanumeric characters (same prefix as complaint_id,
      a different key); referenced by campaign_sends.
    data_tests:
    - not_null
    - unique
  - name: campaign_name
    description: Descriptive unique name encoding objective, product, month and sequence (for example 'CMP_ACQ_CC_Jan2024_0001').
  - name: description
    description: Free-text summary (for example 'Campaña de acquisition para Tarjeta Crédito'), mixed English and
      Spanish. NULL when not provided.
  - name: campaign_type
    description: 'Channel mix: `Email`, `SMS`, `WhatsApp`, `Push`, `Mix`, `Voice`.'
    data_tests:
    - accepted_values:
        arguments:
          values:
          - Email
          - Mix
          - Push
          - SMS
          - Voice
          - WhatsApp
  - name: campaign_objective
    description: 'Business goal: `Retention`, `Cross-sell`, `Acquisition`, `Reactivation`, `Up-sell`.'
    data_tests:
    - accepted_values:
        arguments:
          values:
          - Acquisition
          - Cross-sell
          - Reactivation
          - Retention
          - Up-sell
  - name: promoted_product
    description: Product type promoted, using the products.product_type labels. NULL when not specified.
    data_tests:
    - accepted_values:
        arguments:
          values:
          - Tarjeta Crédito
          - Cuenta Ahorro
          - Préstamo Personal
          - Inversión
          - Cuenta Corriente
          - Préstamo Hipotecario
          - Seguro
        config:
          severity: warn
  - name: target_segment
    description: 'Targeted customers.segment: `Plus`, `Premium`, `Basic`, `Student`. NULL when not specified (no
      restriction assumed).'
    data_tests:
    - accepted_values:
        arguments:
          values:
          - Plus
          - Premium
          - Basic
          - Student
  - name: target_country
    description: '{{ doc("country_name") }} Country targeted. NULL when not specified.'
    data_tests:
    - accepted_values:
        arguments:
          values:
          - México
          - Colombia
          - Argentina
  - name: start_date
    description: First day of the campaign.
  - name: end_date
    description: Last day of the campaign; can be later than the snapshot end.
  - name: budget
    description: Campaign budget; currency not stated. NULL when unknown.
  - name: campaign_status
    description: 'Status: `Completed`, `Paused`, `Active`.'
    data_tests:
    - accepted_values:
        arguments:
          values:
          - Active
          - Completed
          - Paused
  - name: expected_conversion_rate
    description: Expected conversion rate as a percentage number. NULL when unknown.
- name: stg_daily_exchange_rates
  description: Daily exchange rates between COP, ARS, MXN and USD. One row per rate_date, source_currency and target_currency;
    composite primary key enforced by the unique_combination test. Used to convert transaction amounts to USD.
  meta:
    layer: silver
    grain: one row per currency pair and day
    primary_key: the composite key (rate_date, source_currency, target_currency)
    source_dataset: LATAM Bank synthetic dataset v1.0.0 (organizer-provided)
    data_quality:
    - MXN exists here, but transactions and products contain no MXN.
    - source is a random provider label per row, not a currency and not a consistent series.
    - No same-currency pairs; buy_rate <= exchange_rate <= sell_rate holds in every row.
  data_tests:
  - unique_combination:
      arguments:
        column_names:
        - rate_date
        - source_currency
        - target_currency
  columns:
  - name: rate_date
    description: Day the rate applies to. Part of the composite primary key.
  - name: source_currency
    description: 'Currency being converted (ISO 4217): `COP`, `ARS`, `MXN`, `USD`. Part of the composite primary
      key.'
    data_tests:
    - accepted_values:
        arguments:
          values:
          - ARS
          - COP
          - MXN
          - USD
  - name: target_currency
    description: 'Currency converted into (ISO 4217): `COP`, `ARS`, `MXN`, `USD`; never equal to `source_currency`.
      Part of the composite primary key.'
    data_tests:
    - accepted_values:
        arguments:
          values:
          - ARS
          - COP
          - MXN
          - USD
  - name: exchange_rate
    description: Units of `target_currency` per unit of `source_currency` (mid rate). Between `buy_rate` and `sell_rate`.
    data_tests:
    - accepted_range:
        arguments:
          min_value: 1.0e-06
  - name: buy_rate
    description: Rate at which the bank buys the source currency, in target units per source unit; at or below `exchange_rate`
      (definition inferred, not documented).
  - name: sell_rate
    description: Rate at which the bank sells the source currency, in target units per source unit; at or above
      `exchange_rate`.
  - name: source
    description: 'Rate provider label: `Bloomberg`, `Reuters`, `Internal`, `Central Bank`. Assigned per row at random;
      not a currency column.'
    data_tests:
    - accepted_values:
        arguments:
          values:
          - Bloomberg
          - Reuters
          - Internal
          - Central Bank
        config:
          severity: warn
- name: stg_call_transcripts
  description: 'Call transcripts and speech-analytics output. One row per transcript; primary key `transcript_id`;
    at most one per interaction. Outside the customer-service scope: documented but not exposed in gold.'
  meta:
    layer: silver
    grain: one row per call transcript (at most one per interaction)
    primary_key: transcript_id
    source_dataset: LATAM Bank synthetic dataset v1.0.0 (organizer-provided)
    data_quality:
    - 'detected_language is always ''es'' (test: accepted_values, warn).'
    - detected_intents has a single distinct value; no usable intent signal.
    - The text is templated and repeated, with unfilled placeholders in braces; not real free text.
    - detected_keywords only combines banco, cuenta and servicio.
    - customer_id and agent_id match the parent interaction.
  columns:
  - name: transcript_id
    description: Primary key. Format `TRS-` followed by 20 uppercase alphanumeric characters.
    data_tests:
    - not_null
    - unique
  - name: interaction_id
    description: '{{ doc("interaction_id_fk") }} One to one: at most one transcript per interaction.'
    data_tests:
    - not_null
    - relationships:
        arguments:
          to: ref('stg_call_center_interactions')
          field: interaction_id
  - name: process_date
    description: '{{ doc("process_date_partition") }}'
  - name: customer_id
    description: '{{ doc("customer_id_fk") }} Same customer as the parent interaction.'
    data_tests:
    - not_null
    - relationships:
        arguments:
          to: ref('stg_customers')
          field: customer_id
  - name: agent_id
    description: '{{ doc("agent_id_fk") }} Same agent as the parent interaction.'
    data_tests:
    - not_null
    - relationships:
        arguments:
          to: ref('stg_service_agents')
          field: agent_id
  - name: full_text
    description: Whole conversation as alternating 'Cliente:' and 'Agente:' turns, in Spanish. Templated, with unfilled
      placeholders in braces; not real free text.
  - name: customer_text
    description: Customer side of the conversation only, in Spanish. Templated.
  - name: agent_text
    description: Agent side of the conversation only, in Spanish. Templated.
  - name: detected_language
    description: Language detected (ISO 639-1). Always `es` in practice.
    data_tests:
    - accepted_values:
        arguments:
          values:
          - es
        config:
          severity: warn
  - name: detected_accent
    description: 'Regional accent detected from the audio: `mexican`, `colombian`, `argentine`. NULL when not detected.'
    data_tests:
    - accepted_values:
        arguments:
          values:
          - mexican
          - colombian
          - argentine
  - name: accent_confidence
    description: Confidence of the accent detection as a fraction between 0 and 1. NULL when not detected.
  - name: detected_keywords
    description: Keywords detected, as a comma separated string (only banco, cuenta and servicio occur). NULL when
      none.
  - name: mentioned_entities
    description: Entity counts mentioned in the call as a JSON string with keys account_numbers, dates, amounts
      and products. Stored as text, not a JSON type. NULL when none.
  - name: detected_intents
    description: Intent detected; always `consulta_general` when present, so it carries no information.
  - name: main_topics
    description: 'Main topic, same Spanish labels as call_center_interactions.contact_reason: `Transaccional`, `Producto`,
      `Queja`, `Técnico`, `Comercial`, `Retención`.'
    data_tests:
    - accepted_values:
        arguments:
          values:
          - Comercial
          - Producto
          - Queja
          - Retención
          - Técnico
          - Transaccional
  - name: transcription_model
    description: 'Speech-to-text engine: `AWS Transcribe`, `Whisper v3`, `Google STT`, `Azure Speech`.'
    data_tests:
    - accepted_values:
        arguments:
          values:
          - AWS Transcribe
          - Azure Speech
          - Google STT
          - Whisper v3
  - name: audio_quality
    description: 'Audio quality: `High`, `Medium`, `Low`. NULL when not assessed.'
    data_tests:
    - accepted_values:
        arguments:
          values:
          - High
          - Medium
          - Low
  - name: duration_seconds
    description: Duration of the call in seconds. NULL when not recorded.
- name: stg_satisfaction_surveys
  description: 'Post-interaction satisfaction surveys (CSAT, NPS, CES). One row per survey; primary key `survey_id`;
    at most one per interaction. Outside the customer-service scope: documented but not exposed in gold.'
  meta:
    layer: silver
    grain: one row per survey (one per interaction)
    primary_key: survey_id
    source_dataset: LATAM Bank synthetic dataset v1.0.0 (organizer-provided)
    data_quality:
    - main_score has a different scale per survey type and is not a standard 0 to 10 NPS.
    - nps_category never takes the value Promoter and is NULL for some NPS surveys.
    - question_1, question_2 and question_3 are partly NULL.
    - open_comments are a few canned phrases, and comment_sentiment is partly NULL.
    - campaign_response_rate has no documented meaning on a survey.
  columns:
  - name: survey_id
    description: Primary key. Format `SRV-` followed by 20 uppercase alphanumeric characters.
    data_tests:
    - not_null
    - unique
  - name: survey_date
    description: When the survey was answered or recorded. {{ doc("ts_no_tz") }}
  - name: process_date
    description: '{{ doc("process_date_partition") }}'
  - name: interaction_id
    description: '{{ doc("interaction_id_fk") }} One to one: at most one survey per interaction.'
    data_tests:
    - not_null
    - relationships:
        arguments:
          to: ref('stg_call_center_interactions')
          field: interaction_id
  - name: customer_id
    description: '{{ doc("customer_id_fk") }} Same customer as the interaction.'
    data_tests:
    - not_null
    - relationships:
        arguments:
          to: ref('stg_customers')
          field: customer_id
  - name: agent_id
    description: '{{ doc("agent_id_fk") }} Same agent as the interaction.'
    data_tests:
    - not_null
    - relationships:
        arguments:
          to: ref('stg_service_agents')
          field: agent_id
  - name: survey_type
    description: 'Instrument: `CSAT` customer satisfaction, `NPS` net promoter score, `CES` customer effort score.'
    data_tests:
    - accepted_values:
        arguments:
          values:
          - CES
          - CSAT
          - NPS
  - name: send_channel
    description: 'Channel through which the survey was sent: `Email`, `SMS`, `App`, `IVR`, `Web`.'
    data_tests:
    - accepted_values:
        arguments:
          values:
          - Email
          - SMS
          - App
          - IVR
          - Web
  - name: main_score
    description: Main score, integer 1 to 7. The scale depends on `survey_type` (CSAT and CES 1 to 4, NPS 2 to 7);
      not a 0 to 10 NPS scale.
    data_tests:
    - accepted_range:
        arguments:
          min_value: 1
          max_value: 7
  - name: nps_category
    description: 'NPS classification: `Detractor`, `Passive`, `Promoter` (`Promoter` never occurs). NULL for CSAT
      and CES surveys and some NPS surveys.'
    data_tests:
    - accepted_values:
        arguments:
          values:
          - Detractor
          - Passive
          - Promoter
  - name: question_1_text
    description: Text of the first question, in Spanish (three variants, for example '¿Cómo calificaría la atención
      brindada?', how would you rate the service). NULL when not asked.
  - name: question_1_response
    description: Answer to question 1 on a 1 to 5 scale. NULL when not asked.
  - name: question_2_text
    description: Text of the second question, in Spanish ('¿El tiempo de espera fue aceptable?', was the waiting
      time acceptable). NULL when not asked.
  - name: question_2_response
    description: Answer to question 2 on a 1 to 5 scale. NULL when not asked.
  - name: question_3_text
    description: Text of the third question, in Spanish ('¿Volvería a contactarnos por este canal?', would you contact
      us again through this channel). NULL when not asked.
  - name: question_3_response
    description: Answer to question 3 on a 1 to 5 scale. NULL when not asked.
  - name: open_comments
    description: Free comment in Spanish, one of a few canned phrases (for example 'Tardaron mucho en atenderme.',
      they took long to attend me). NULL when none.
  - name: comment_sentiment
    description: 'Sentiment of `open_comments`: `Negative`, `Neutral`, `Positive`. NULL when there is no comment.'
    data_tests:
    - accepted_values:
        arguments:
          values:
          - Negative
          - Neutral
          - Positive
  - name: response_time_hours
    description: Approximate hours between the interaction and the survey response; not an exact difference of the
      dates (definition not documented).
  - name: campaign_response_rate
    description: Meaning not confirmed in the dataset documentation; apparently a campaign-level response rate attached
      to the survey. NULL when unavailable.
- name: stg_campaign_sends
  description: 'Marketing messages sent to customers. One row per send; primary key `send_id`. Outside the customer-service
    scope: documented but not exposed in gold.'
  meta:
    layer: silver
    grain: one row per message sent to one customer
    primary_key: send_id
    source_dataset: LATAM Bank synthetic dataset v1.0.0 (organizer-provided)
    data_quality:
    - 'The daily files have gaps: some days are missing and it is unknown whether that is intentional.'
    - subject contains the literal text 'nan' where the promoted product is missing.
    - was_opened is NULL for undelivered sends and for part of the delivered ones; NULL means unknown, not 'not
      opened'.
    - send_cost is partly NULL and conversion_value has no currency.
    - open_date, click_date and conversion_date can be later than the snapshot end.
  columns:
  - name: send_id
    description: Primary key. Format `SND-` followed by 20 uppercase alphanumeric characters.
    data_tests:
    - not_null
    - unique
  - name: send_date
    description: When the message was sent. {{ doc("ts_no_tz") }}
  - name: process_date
    description: '{{ doc("process_date_partition") }} Some days have no file.'
  - name: campaign_id
    description: Campaign the message belongs to. References marketing_campaigns.campaign_id.
    data_tests:
    - not_null
    - relationships:
        arguments:
          to: ref('stg_marketing_campaigns')
          field: campaign_id
  - name: customer_id
    description: '{{ doc("customer_id_fk") }} Recipient.'
    data_tests:
    - not_null
    - relationships:
        arguments:
          to: ref('stg_customers')
          field: customer_id
  - name: send_channel
    description: 'Channel used: `Email`, `SMS`, `WhatsApp`, `Push`, `Voice`.'
    data_tests:
    - accepted_values:
        arguments:
          values:
          - Email
          - Push
          - SMS
          - Voice
          - WhatsApp
  - name: template_used
    description: Message template identifier, 'template_{campaign_id}_{n}'. NULL when not recorded.
  - name: subject
    description: Message subject in Spanish, '¡Oferta especial en {product}!' (special offer on ...). Contains the
      literal 'nan' when the product was missing. NULL when not recorded.
  - name: send_status
    description: 'Delivery outcome: `Sent`, `Failed`, `Bounced`, `Blocked`.'
    data_tests:
    - accepted_values:
        arguments:
          values:
          - Blocked
          - Bounced
          - Failed
          - Sent
  - name: was_delivered
    description: Whether the message was delivered; equivalent to `send_status = 'Sent'`.
  - name: was_opened
    description: Whether the recipient opened the message. NULL means unknown or not applicable (including every
      undelivered send), not 'not opened'.
  - name: open_date
    description: When the message was first opened. NULL when not opened or unknown. {{ doc("ts_no_tz") }}
  - name: was_clicked
    description: Whether the recipient clicked a link.
  - name: click_date
    description: When the link was clicked. NULL when no click. {{ doc("ts_no_tz") }}
  - name: click_count
    description: Number of clicks (integer). NULL when no click.
  - name: had_conversion
    description: Whether the send led to a conversion.
  - name: conversion_date
    description: When the conversion happened. NULL when no conversion. {{ doc("ts_no_tz") }}
  - name: conversion_value
    description: Value of the conversion; currency not stated. NULL when no conversion.
  - name: open_device
    description: 'Device on which the message was opened: `Desktop`, `Tablet`, `Mobile`. NULL when not opened.'
    data_tests:
    - accepted_values:
        arguments:
          values:
          - Desktop
          - Tablet
          - Mobile
  - name: open_country
    description: '{{ doc("country_name") }} Country of the opening. NULL when not opened.'
  - name: failure_reason
    description: 'Why an undelivered send failed: `SMTP error` (Failed), `Invalid email address` (Bounced), `User
      blocked sender` (Blocked). NULL for delivered sends and some undelivered ones.'
    data_tests:
    - accepted_values:
        arguments:
          values:
          - SMTP error
          - Invalid email address
          - User blocked sender
        config:
          severity: warn
  - name: send_cost
    description: Cost of the send; currency not stated. NULL when unknown.
- name: stg_digital_events
  description: 'Digital-channel events (web and app page views, clicks, logins, purchases). One row per event; primary
    key `event_id`. Outside the customer-service scope: documented but not exposed in gold.'
  meta:
    layer: silver
    grain: one row per digital event
    primary_key: event_id
    source_dataset: LATAM Bank synthetic dataset v1.0.0 (organizer-provided)
    contains_pii: true
    data_quality:
    - customer_id is NULL for anonymous sessions; a session never maps to more than one customer.
    - ip_country has both 'Mexico' and 'México' in the source; silver conforms it to 'México'.
    - 'Null patterns follow the event type: event_value only for FormSubmit and Purchase, product_id only for Click
      and PageView, duration_seconds only for PageView.'
    - browser is NULL on app channels and app_version on web channels.
    - event_value has no currency.
  columns:
  - name: event_id
    description: Primary key. Format `EVT-` followed by 20 uppercase alphanumeric characters.
    data_tests:
    - not_null
    - unique
  - name: event_date
    description: When the event happened. {{ doc("ts_no_tz") }}
  - name: process_date
    description: '{{ doc("process_date_partition") }}'
  - name: customer_id
    description: Customer who generated the event. References customers.customer_id. NULL for anonymous sessions.
    data_tests:
    - relationships:
        arguments:
          to: ref('stg_customers')
          field: customer_id
  - name: session_id
    description: Session the event belongs to; format `SES-` followed by 32 characters. A session has one customer,
      one IP address and one channel.
  - name: event_type
    description: 'Kind of event: `PageView`, `Click`, `Login`, `Logout`, `FormSubmit`, `Error`, `Purchase`.'
    data_tests:
    - accepted_values:
        arguments:
          values:
          - Click
          - Error
          - FormSubmit
          - Login
          - Logout
          - PageView
          - Purchase
  - name: event_category
    description: 'Functional area: `Authentication`, `Navigation`, `Product`, `Transaction`.'
    data_tests:
    - accepted_values:
        arguments:
          values:
          - Authentication
          - Navigation
          - Product
          - Transaction
  - name: channel
    description: 'Digital channel: `Android App`, `iOS App`, `Desktop Web`, `Mobile Web`.'
    data_tests:
    - accepted_values:
        arguments:
          values:
          - Android App
          - Desktop Web
          - iOS App
          - Mobile Web
  - name: platform
    description: 'Operating system of the device: `Android`, `iOS`, `Windows`, `Linux`, `MacOS`. NULL when not recorded.'
    data_tests:
    - accepted_values:
        arguments:
          values:
          - Android
          - iOS
          - Windows
          - Linux
          - MacOS
  - name: browser
    description: 'Web browser: `Safari`, `Chrome`, `Samsung Internet`, `Firefox`, `Edge`. NULL on app channels.'
    data_tests:
    - accepted_values:
        arguments:
          values:
          - Safari
          - Chrome
          - Samsung Internet
          - Firefox
          - Edge
  - name: app_version
    description: Mobile app version (for example '3.8.1'). NULL on web channels.
  - name: page_url
    description: Path of the page or screen (for example /login, /accounts, /transactions). NULL when not recorded.
  - name: page_title
    description: Page title in Spanish for the same pages as `page_url` (for example 'Iniciar Sesión' for /login).
  - name: action
    description: 'Action performed: `view_product`, `view_products`, `view_home`, `view_accounts`, `view_transactions`,
      `view_help`, `initiate_payment`, `initiate_transfer`, `login`, `logout`. NULL when not recorded.'
    data_tests:
    - accepted_values:
        arguments:
          values:
          - view_product
          - logout
          - login
          - initiate_payment
          - initiate_transfer
          - view_transactions
          - view_accounts
          - view_products
          - view_help
          - view_home
        config:
          severity: warn
  - name: element_id
    description: Interface element involved (for example login_form, logout_btn, payment_form). NULL when none.
  - name: product_id
    description: '{{ doc("product_id_fk") }} Product involved. Populated only for Click and PageView events.'
    data_tests:
    - relationships:
        arguments:
          to: ref('stg_products')
          field: product_id
  - name: event_value
    description: Monetary value of the event; currency not stated. Populated only for FormSubmit and Purchase events.
  - name: duration_seconds
    description: Seconds the user stayed on the page. Populated only for PageView events.
  - name: ip_address
    description: IPv4 address of the client; one per session. NULL when not recorded. {{ doc("pii_synthetic") }}
    meta:
      contains_pii: true
  - name: ip_country
    description: '{{ doc("country_name") }} Country resolved from the IP address.'
    data_tests:
    - accepted_values:
        arguments:
          values:
          - México
          - Colombia
          - Argentina
  - name: ip_city
    description: City resolved from the IP address (same cities as customers.city). NULL when not resolved.
  - name: is_mobile
    description: Whether the device is mobile (app channels plus Mobile Web); false only for Desktop Web.
  - name: referrer
    description: Referring site (instagram, email marketing, google, facebook). NULL for most events.
  - name: utm_source
    description: UTM traffic source (email, direct, google, facebook). NULL for most events.
  - name: utm_medium
    description: UTM medium (organic, email, social, cpc). NULL for most events.
  - name: utm_campaign
    description: UTM campaign tag (retention, spring_promo, new_users). Does not reference marketing_campaigns.campaign_id.
      NULL for most events.
