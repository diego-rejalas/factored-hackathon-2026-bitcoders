- name: stg_daily_exchange_rates
  description: >-
    Daily exchange rates between the four currencies of the dataset (USD, MXN, COP, ARS), used to convert
    amounts to a common currency.


    **Grain:** One row per currency pair and day.


    **Primary key:** the composite key (`rate_date`, `source_currency`, `target_currency`).


    **Source:** Organizer-provided synthetic LATAM Bank dataset (v1.0.0, CSV files on S3), loaded as `bronze.daily_exchange_rates`.
    This silver model is a typed view over bronze: real data types, empty strings turned into NULL.


    **Coverage:** 13,164 rows: 1,097 days (2023-06-17 to 2026-06-17) times 12 ordered currency pairs (3,291
    rows per currency on each side).


    **How we use it:** Normalising amounts across currencies: transactions.amount_usd gaps, products and
    credit amounts, and any debt-to-income calculation. It is the only table with a complete MXN series.
  meta:
    layer: silver
    grain: one row per currency pair and day
    primary_key: the composite key (rate_date, source_currency, target_currency)
    source_dataset: LATAM Bank synthetic dataset v1.0.0 (organizer-provided)
    data_quality:
    - >-
      MXN exists here (all pairs, 1,097 rows each) while transactions and products contain no MXN, so
      there is nothing in MXN to convert.
    - >-
      The source column is a random provider label per row (Bloomberg 3,303, Reuters 3,297, Internal 3,293,
      Central Bank 3,271), not a currency and not a consistent series.
    - >-
      There are no same-currency pairs, and buy_rate <= exchange_rate <= sell_rate holds in all 13,164
      rows.
  data_tests:
  - unique_combination:
      arguments:
        column_names:
        - rate_date
        - source_currency
        - target_currency
  columns:
  - name: rate_date
    description: >-
      Day the rate applies to, from 2023-06-17 to 2026-06-17 (1,097 days). Part of the composite primary
      key.
  - name: source_currency
    description: >-
      Currency being converted (ISO 4217): `COP`, `ARS`, `MXN` or `USD` (3,291 rows each). Part of the
      composite primary key.
    data_tests:
    - accepted_values:
        arguments:
          values:
          - ARS
          - COP
          - MXN
          - USD
  - name: target_currency
    description: >-
      Currency converted into (ISO 4217): `COP`, `ARS`, `MXN` or `USD` (3,291 rows each); never equal
      to `source_currency`. Part of the composite primary key.
    data_tests:
    - accepted_values:
        arguments:
          values:
          - ARS
          - COP
          - MXN
          - USD
  - name: exchange_rate
    description: >-
      Units of `target_currency` per one unit of `source_currency` (mid rate), 8 decimals. For example
      1 USD = 4,037.97 COP on 2025-01-02. Always between `buy_rate` and `sell_rate`.
    data_tests:
    - accepted_range:
        arguments:
          min_value: 1.0e-06
  - name: buy_rate
    description: >-
      Rate at which the bank buys the source currency, in target units per source unit; always at or below
      `exchange_rate`. The buy and sell definitions are inferred from the ordering and not documented.
  - name: sell_rate
    description: >-
      Rate at which the bank sells the source currency, in target units per source unit; always at or
      above `exchange_rate`.
  - name: source
    description: >-
      Label of the rate provider: `Bloomberg` 3,303, `Reuters` 3,297, `Internal` 3,293, `Central Bank`
      3,271. Assigned per row at random; it is not a currency column.
- name: stg_call_transcripts
  description: >-
    Text transcripts of contact-center calls with speaker turns, detected language, accent, topics and
    speech-to-text metadata.


    **Grain:** One row per call transcript (at most one per interaction).


    **Primary key:** `transcript_id`.


    **Source:** Organizer-provided synthetic LATAM Bank dataset (v1.0.0, CSV files on S3), loaded as `bronze.call_transcripts`.
    This silver model is a typed view over bronze: real data types, empty strings turned into NULL.


    **Coverage:** 171,321 transcripts from 2023-06-17 to 2026-06-17, one source file per day, each linked
    one to one to a call_center_interactions row (the 171,321 interactions with has_transcript = true)
    by 101,951 customers and 1,090 agents.


    **How we use it:** Context only. The text is templated, so it is not a basis for intent training;
    the real structured signal sits in call_center_interactions.
  meta:
    layer: silver
    grain: one row per call transcript (at most one per interaction)
    primary_key: transcript_id
    source_dataset: LATAM Bank synthetic dataset v1.0.0 (organizer-provided)
    data_quality:
    - detected_language is 'es' in all 171,321 rows; there is no Portuguese or other language.
    - >-
      detected_intents is 'consulta_general' in 95.0% of rows (162,864) and NULL in 4.9%; it has a single
      distinct value.
    - >-
      The text is templated: customer_text and agent_text have 42 distinct values each over 171,321 rows
      and full_text 546, and every full_text keeps unfilled placeholders (monto, moneda, limite) in braces.
    - detected_keywords only combines the words banco, cuenta and servicio (12 distinct values).
    - detected_accent is NULL in 36.8% of rows, more than the 29.8% of the parent interaction.
    - customer_id and agent_id match the parent interaction in 100% of rows.
  columns:
  - name: transcript_id
    description: Primary key of the transcript. Format `TRS-` followed by 20 uppercase alphanumeric characters.
    data_tests:
    - not_null
    - unique
  - name: interaction_id
    description: '{{ doc("interaction_id_fk") }} One to one: each interaction has at most one transcript.'
    data_tests:
    - not_null
    - relationships:
        arguments:
          to: ref('stg_call_center_interactions')
          field: interaction_id
  - name: process_date
    description: '{{ doc("process_date_partition") }}'
  - name: customer_id
    description: '{{ doc("customer_id_fk") }} Same customer as the parent interaction.'
    data_tests:
    - not_null
    - relationships:
        arguments:
          to: ref('stg_customers')
          field: customer_id
  - name: agent_id
    description: '{{ doc("agent_id_fk") }} Same agent as the parent interaction.'
    data_tests:
    - not_null
    - relationships:
        arguments:
          to: ref('stg_service_agents')
          field: agent_id
  - name: full_text
    description: >-
      Whole conversation as alternating 'Cliente:' and 'Agente:' turns separated by blank lines, in Spanish.
      Templated: 546 distinct values over 171,321 rows, and every row contains unfilled placeholders such
      as monto, moneda and limite in braces.
  - name: customer_text
    description: 'Customer side of the conversation only, in Spanish. Templated: 42 distinct values.'
  - name: agent_text
    description: 'Agent side of the conversation only, in Spanish. Templated: 42 distinct values.'
  - name: detected_language
    description: >-
      Language detected in the call (ISO 639-1). Always `es` (171,321 of 171,321): no other language appears.
    data_tests:
    - accepted_values:
        arguments:
          values:
          - es
        config:
          severity: warn
  - name: detected_accent
    description: >-
      Regional accent detected from the audio: `mexican` 54,152, `colombian` 32,284, `argentine` 21,802.
      NULL in 36.8%.
  - name: accent_confidence
    description: Confidence of the accent detection as a fraction from 0.75 to 0.99 (8 decimals). NULL
      in 10.0%.
  - name: detected_keywords
    description: >-
      Keywords detected, as a comma separated string. Only combinations of 'banco', 'cuenta' and 'servicio'
      occur (12 distinct values). NULL in 5.1%.
  - name: mentioned_entities
    description: >-
      Counts of entities mentioned in the call, as a JSON string with the keys account_numbers, dates,
      amounts and products (for example '{"account_numbers": 1, "dates": 0, "amounts": 1, "products":
      "Cuenta Ahorro"}'). NULL in 10.0%; 54 distinct values. Stored as text, not as a JSON type.
  - name: detected_intents
    description: >-
      Intent detected in the call. Always `consulta_general` when present (162,864 rows, 95.0%); NULL
      in 4.9%. Carries no discriminating information.
  - name: main_topics
    description: >-
      Main topic of the call, using the same labels as call_center_interactions.contact_reason: `Transaccional`
      59,786, `Producto` 37,658, `Queja` 29,198, `Técnico` 25,691, `Comercial` 13,808, `Retención` 5,180.
    data_tests:
    - accepted_values:
        arguments:
          values:
          - Comercial
          - Producto
          - Queja
          - Retención
          - Técnico
          - Transaccional
  - name: transcription_model
    description: >-
      Speech-to-text engine that produced the transcript: `AWS Transcribe` 43,117, `Whisper v3` 42,803,
      `Google STT` 42,740, `Azure Speech` 42,661 (evenly spread).
    data_tests:
    - accepted_values:
        arguments:
          values:
          - AWS Transcribe
          - Azure Speech
          - Google STT
          - Whisper v3
  - name: audio_quality
    description: 'Quality of the audio: `High` 114,371, `Medium` 40,350, `Low` 7,962. NULL in 5.0%.'
  - name: duration_seconds
    description: Duration of the call in seconds, from 30 to 1,151. NULL in 14.0%.
- name: stg_satisfaction_surveys
  description: >-
    Post-interaction satisfaction surveys (CSAT, NPS and CES) answered by customers, with up to three
    question responses and an optional comment.


    **Grain:** One row per survey (one per interaction).


    **Primary key:** `survey_id`.


    **Source:** Organizer-provided synthetic LATAM Bank dataset (v1.0.0, CSV files on S3), loaded as `bronze.satisfaction_surveys`.
    This silver model is a typed view over bronze: real data types, empty strings turned into NULL.


    **Coverage:** 212,759 surveys from 2023-06-17 09:29:20 to 2026-06-19 06:54:58, one source file per
    day, each tied one to one to a call_center_interactions row (with the same customer and agent) by
    113,640 customers. Types: CSAT 127,856, NPS 63,668, CES 21,235.


    **How we use it:** Satisfaction context for the evaluation. The score has no relationship with escalation
    (average 3.526 without escalation and 3.527 with it).
  meta:
    layer: silver
    grain: one row per survey (one per interaction)
    primary_key: survey_id
    source_dataset: LATAM Bank synthetic dataset v1.0.0 (organizer-provided)
    data_quality:
    - >-
      main_score does not use one scale per survey type: CSAT and CES surveys score 1 to 4 and NPS surveys
      2 to 7, so it is not a standard 0 to 10 NPS.
    - >-
      nps_category never takes the value Promoter (Detractor 45,007, Passive 15,387) and is NULL in 3,274
      of the 63,668 NPS surveys.
    - question_1, question_2 and question_3 are NULL in 43.0%, 61.8% and 81.1% of rows.
    - open_comments are 13 canned phrases, and comment_sentiment is NULL in 52.4% of rows.
    - campaign_response_rate has no documented meaning on a survey (15.00 to 45.00, NULL in 15.1%).
  columns:
  - name: survey_id
    description: Primary key of the survey. Format `SRV-` followed by 20 uppercase alphanumeric characters.
    data_tests:
    - not_null
    - unique
  - name: survey_date
    description: >-
      Date and time the survey was answered or recorded, from 2023-06-17 09:29:20 to 2026-06-19 06:54:58;
      never earlier than its interaction. {{ doc("ts_no_tz") }}
  - name: process_date
    description: '{{ doc("process_date_partition") }}'
  - name: interaction_id
    description: '{{ doc("interaction_id_fk") }} One to one: each interaction has at most one survey.'
    data_tests:
    - not_null
    - relationships:
        arguments:
          to: ref('stg_call_center_interactions')
          field: interaction_id
  - name: customer_id
    description: '{{ doc("customer_id_fk") }} Same customer as the interaction.'
    data_tests:
    - not_null
    - relationships:
        arguments:
          to: ref('stg_customers')
          field: customer_id
  - name: agent_id
    description: '{{ doc("agent_id_fk") }} Same agent as the interaction.'
    data_tests:
    - not_null
    - relationships:
        arguments:
          to: ref('stg_service_agents')
          field: agent_id
  - name: survey_type
    description: >-
      Survey instrument: `CSAT` customer satisfaction 127,856, `NPS` net promoter score 63,668, `CES`
      customer effort score 21,235.
    data_tests:
    - accepted_values:
        arguments:
          values:
          - CES
          - CSAT
          - NPS
  - name: send_channel
    description: >-
      Channel through which the survey was sent: `Email` 84,880, `SMS` 63,798, `App` 42,595, `IVR` 10,836,
      `Web` 10,650.
  - name: main_score
    description: >-
      Main score of the survey, integer from 1 to 7 (3 is the most frequent, 90,363 rows; 1 only 5,159).
      The range depends on the type: CSAT and CES use 1 to 4, NPS uses 2 to 7. Not a 0 to 10 NPS scale.
    data_tests:
    - accepted_range:
        arguments:
          min_value: 1
          max_value: 7
  - name: nps_category
    description: >-
      NPS classification: `Detractor` 45,007 (scores 2 to 6) or `Passive` 15,387 (score 7); `Promoter`
      never occurs. NULL for CSAT and CES surveys (as expected) and for 3,274 NPS surveys (71.6% overall).
    data_tests:
    - accepted_values:
        arguments:
          values:
          - Detractor
          - Passive
          - Promoter
  - name: question_1_text
    description: >-
      Text of the first question, in Spanish. Three variants: '¿Cómo calificaría la atención brindada?'
      (how would you rate the service), '¿El agente resolvió su consulta satisfactoriamente?' (did the
      agent resolve your query) and '¿Qué tan satisfecho está con el servicio recibido?' (how satisfied
      are you). NULL in 43.0%.
  - name: question_1_response
    description: Answer to question 1 on a 1 to 5 scale, evenly distributed. NULL in 43.0%.
  - name: question_2_text
    description: >-
      Text of the second question, always '¿El tiempo de espera fue aceptable?' (was the waiting time
      acceptable) when present. NULL in 61.8%.
  - name: question_2_response
    description: Answer to question 2 on a 1 to 5 scale, evenly distributed. NULL in 61.7%.
  - name: question_3_text
    description: >-
      Text of the third question, always '¿Volvería a contactarnos por este canal?' (would you contact
      us again through this channel) when present. NULL in 81.1%.
  - name: question_3_response
    description: Answer to question 3 on a 1 to 5 scale, evenly distributed. NULL in 81.2%.
  - name: open_comments
    description: >-
      Free comment, in Spanish, one of 13 canned phrases (for example 'Tardaron mucho en atenderme.',
      'Excelente atención, muy amable el agente.'). Not real free text. NULL in 52.4%.
  - name: comment_sentiment
    description: >-
      Sentiment of `open_comments`: `Negative` 67,529, `Neutral` 26,774, `Positive` 6,954. NULL in 52.4%
      (no comment).
    data_tests:
    - accepted_values:
        arguments:
          values:
          - Negative
          - Neutral
          - Positive
  - name: response_time_hours
    description: >-
      Approximate hours between the interaction and the survey response, from 1.01 to 35.97 (correlation
      0.89 with the measured difference between survey_date and interaction_date, whose average is 12.5
      hours versus 18.5 here), so it is not an exact difference. The definition is not documented.
  - name: campaign_response_rate
    description: >-
      Meaning not confirmed in the dataset documentation. Observed: a value from 15.00 to 45.00 (8 decimals),
      NULL in 15.1%, apparently a campaign-level response rate attached to the survey.
- name: stg_campaign_sends
  description: >-
    Individual marketing messages sent to customers within a campaign, with delivery, open, click and
    conversion tracking.


    **Grain:** One row per message sent to one customer.


    **Primary key:** `send_id`.


    **Source:** Organizer-provided synthetic LATAM Bank dataset (v1.0.0, CSV files on S3), loaded as `bronze.campaign_sends`.
    This silver model is a typed view over bronze: real data types, empty strings turned into NULL.


    **Coverage:** 1,746,801 sends from 2023-07-01 06:00:42 to 2026-06-18 05:59:53 in 1,083 daily files
    (14 days fewer than the other partitioned tables), covering all 150,000 customers and 175 of the 200
    campaigns. Delivered 1,642,044 (94.0%), Failed 52,306, Bounced 34,900, Blocked 17,551.


    **How we use it:** Not used by the customer-service workflow (it supports the marketing track). The
    chain from sends to complaints within two days is 0% to 0.23%, so it carries no causal signal.
  meta:
    layer: silver
    grain: one row per message sent to one customer
    primary_key: send_id
    source_dataset: LATAM Bank synthetic dataset v1.0.0 (organizer-provided)
    data_quality:
    - >-
      1,083 daily files instead of 1,097: 14 days are missing and it is unknown whether that is intentional.
    - >-
      subject contains the literal text 'nan' in 38,142 rows ('¡Oferta especial en nan!'), a missing promoted
      product leaked as text.
    - >-
      was_opened is NULL in 27.7% of rows (all 104,757 undelivered sends plus 379,472 delivered ones);
      open_date, open_device and open_country are NULL in 72.1% to 74.9%.
    - >-
      send_cost is NULL in 15.0% and conversion_value carries no currency; failure_reason is populated
      for 99,597 of the 104,757 undelivered sends.
    - >-
      open_date, click_date and conversion_date run up to 2026-06-26, past the end of the snapshot (2026-06-18).
  columns:
  - name: send_id
    description: Primary key of the send. Format `SND-` followed by 20 uppercase alphanumeric characters.
    data_tests:
    - not_null
    - unique
  - name: send_date
    description: >-
      Date and time the message was sent, from 2023-07-01 06:00:42 to 2026-06-18 05:59:53. {{ doc("ts_no_tz")
      }}
  - name: process_date
    description: '{{ doc("process_date_partition") }} Only 1,083 distinct dates (14 days have no file).'
  - name: campaign_id
    description: >-
      Campaign the message belongs to. References marketing_campaigns.campaign_id; 175 of the 200 campaigns
      have sends.
    data_tests:
    - not_null
    - relationships:
        arguments:
          to: ref('stg_marketing_campaigns')
          field: campaign_id
  - name: customer_id
    description: '{{ doc("customer_id_fk") }} Recipient; all 150,000 customers received at least one message.'
    data_tests:
    - not_null
    - relationships:
        arguments:
          to: ref('stg_customers')
          field: customer_id
  - name: send_channel
    description: 'Channel used: `Email` 620,195, `SMS` 432,283, `WhatsApp` 349,144, `Push` 290,650, `Voice`
      54,529.'
    data_tests:
    - accepted_values:
        arguments:
          values:
          - Email
          - Push
          - SMS
          - Voice
          - WhatsApp
  - name: template_used
    description: Message template identifier, 'template_{campaign_id}_{n}' (875 distinct values). NULL
      in 10.0%.
  - name: subject
    description: >-
      Message subject, in Spanish, '¡Oferta especial en {product}!' (8 distinct values). Contains the
      literal 'nan' as the product in 38,142 rows ('¡Oferta especial en nan!'), a missing value rendered
      as text. NULL in 68.0%.
  - name: send_status
    description: 'Delivery outcome: `Sent` 1,642,044, `Failed` 52,306, `Bounced` 34,900, `Blocked` 17,551.'
    data_tests:
    - accepted_values:
        arguments:
          values:
          - Blocked
          - Bounced
          - Failed
          - Sent
  - name: was_delivered
    description: >-
      Whether the message was delivered: `true` 1,642,044, `false` 104,757. It is exactly `send_status
      = 'Sent'`.
  - name: was_opened
    description: >-
      Whether the recipient opened the message: `true` 487,309, `false` 775,263. NULL in 27.7%: for every
      undelivered send and for 379,472 delivered ones, so NULL means unknown or not applicable, not 'not
      opened'.
  - name: open_date
    description: Date and time of the first open. NULL in 72.1%. {{ doc("ts_no_tz") }}
  - name: was_clicked
