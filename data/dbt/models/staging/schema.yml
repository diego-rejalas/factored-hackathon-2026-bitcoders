version: 2
models:
- name: stg_customers
  description: customers con tipos reales, vacío normalizado a null.
  columns:
  - name: customer_id
    description: Identificador del cliente (clave en customers; referencia en el resto de tablas).
    data_tests:
    - not_null
    - unique
  - name: document_number
    description: Número del documento de identidad (ficticio).
  - name: document_type
    description: Tipo de documento de identidad.
  - name: first_name
    description: Nombre del cliente (ficticio).
  - name: last_name
    description: Apellido del cliente (ficticio).
  - name: date_of_birth
    description: Fecha de nacimiento.
  - name: gender
    description: Género declarado.
  - name: email
    description: Correo electrónico (ficticio).
  - name: mobile_phone
    description: Teléfono móvil (ficticio).
  - name: landline_phone
    description: Teléfono fijo (ficticio).
  - name: address
    description: Dirección postal.
  - name: city
    description: Ciudad del cliente.
  - name: state
    description: Estado o departamento del cliente.
  - name: country
    description: País del cliente (México, Colombia o Argentina, normalizado).
    data_tests:
    - accepted_values:
        arguments:
          values:
          - México
          - Colombia
          - Argentina
  - name: postal_code
    description: Código postal.
  - name: detected_accent
    description: Acento regional detectado a partir de la voz del cliente.
  - name: segment
    description: Segmento comercial del cliente.
  - name: credit_score
    description: Nulo en 15,0%. Mínimo real 422.
    data_tests:
    - accepted_range:
        arguments:
          min_value: 300
          max_value: 850
  - name: estimated_monthly_income
    description: Ingreso mensual estimado, en la moneda del país del cliente.
  - name: occupation
    description: Ocupación declarada.
  - name: marital_status
    description: Estado civil.
  - name: education_level
    description: Nivel educativo.
  - name: registration_date
    description: Fecha y hora de registro del cliente.
  - name: registration_branch_id
    description: 'DEFECTO CONOCIDO: 149.995 de 150.000 no existen en branches. La advertencia mide el defecto; no usar este campo.'
    data_tests:
    - relationships:
        arguments:
          to: ref('stg_branches')
          field: branch_id
        config:
          severity: warn
  - name: customer_status
    description: 'Estado del cliente: Active, Inactive, Suspended o Closed.'
    data_tests:
    - accepted_values:
        arguments:
          values:
          - Active
          - Inactive
          - Suspended
          - Closed
  - name: last_updated
    description: Última actualización del registro del cliente.
  - name: accepts_marketing
    description: El cliente acepta recibir comunicaciones de marketing.
- name: stg_products
  description: 'products con tipos reales. currency NUNCA trae MXN (limitación de datos conocida, ver spec/DATA_FINDINGS.md): no agregar un test accepted_values que exija MXN.'
  columns:
  - name: product_id
    description: Identificador del producto bancario (clave en products).
    data_tests:
    - not_null
    - unique
  - name: customer_id
    description: Identificador del cliente (clave en customers; referencia en el resto de tablas).
    data_tests:
    - not_null
    - relationships:
        arguments:
          to: ref('stg_customers')
          field: customer_id
  - name: product_type
    description: Tipo de producto (cuenta, tarjeta, crédito, etc.).
    data_tests:
    - accepted_values:
        arguments:
          values:
          - Cuenta Ahorro
          - Cuenta Corriente
          - Tarjeta Crédito
          - Tarjeta Débito
          - Préstamo Personal
          - Préstamo Hipotecario
          - Inversión
          - Seguro
  - name: product_number
    description: Número del producto (cuenta o tarjeta) tal como lo ve el cliente.
  - name: currency
    description: Moneda del producto.
    data_tests:
    - accepted_values:
        arguments:
          values:
          - USD
          - COP
          - ARS
  - name: current_balance
    description: Saldo actual, en la moneda del producto.
  - name: credit_limit
    description: Límite de crédito, en la moneda del producto.
    data_tests:
    - accepted_range:
        arguments:
          min_value: 0
  - name: interest_rate
    description: Tasa de interés del producto.
  - name: opening_date
    description: Fecha de apertura del producto.
  - name: expiration_date
    description: Fecha de vencimiento del producto (por ejemplo, de la tarjeta).
  - name: opening_branch_id
    description: Sucursal donde se abrió el producto.
    data_tests:
    - relationships:
        arguments:
          to: ref('stg_branches')
          field: branch_id
  - name: product_status
    description: Estado del producto.
    data_tests:
    - accepted_values:
        arguments:
          values:
          - Active
          - Closed
          - Blocked
          - Suspended
  - name: opening_channel
    description: Canal por el que se abrió el producto.
  - name: has_linked_app
    description: El cliente tiene la aplicación vinculada.
  - name: days_past_due
    description: Días de atraso en el pago; 0 si está al día.
  - name: last_transaction_date
    description: Fecha de la última transacción del producto.
  - name: last_updated
    description: Última actualización del registro del cliente.
- name: stg_transactions
  description: transactions con tipos reales. is_fraud y fraud_score son ground truth de evaluación, no input para el agente.
  columns:
  - name: transaction_id
    description: Identificador único de la transacción.
    data_tests:
    - not_null
    - unique
  - name: transaction_date
    description: Fecha y hora en que ocurrió la transacción.
  - name: process_date
    description: Fecha en que el banco procesó la transacción (nunca posterior a un día de la transacción).
  - name: product_id
    description: Identificador del producto bancario (clave en products).
    data_tests:
    - not_null
    - relationships:
        arguments:
          to: ref('stg_products')
          field: product_id
  - name: customer_id
    description: Identificador del cliente (clave en customers; referencia en el resto de tablas).
    data_tests:
    - not_null
    - relationships:
        arguments:
          to: ref('stg_customers')
          field: customer_id
  - name: transaction_type
    description: Tipo de transacción.
  - name: transaction_category
    description: Categoría de la transacción.
  - name: amount
    description: Monto en la moneda original de la transacción.
    data_tests:
    - accepted_range:
        arguments:
          min_value: 0.01
  - name: currency
    description: Moneda original de la transacción.
    data_tests:
    - accepted_values:
        arguments:
          values:
          - USD
          - COP
          - ARS
  - name: amount_usd
    description: Monto convertido a dólares; nulo en una parte de las transacciones en moneda local.
  - name: channel
    description: Canal por el que se hizo la transacción.
  - name: branch_id
    description: Identificador de la sucursal.
    data_tests:
    - relationships:
        arguments:
          to: ref('stg_branches')
          field: branch_id
  - name: merchant_name
    description: Nombre del comercio.
  - name: merchant_category
    description: Categoría del comercio.
  - name: transaction_country
    description: País donde ocurrió la transacción.
  - name: transaction_city
    description: Ciudad donde ocurrió la transacción.
  - name: transaction_status
    description: Estado de la transacción (por ejemplo, Completed, Declined, Reversed).
    data_tests:
    - accepted_values:
        arguments:
          values:
          - Approved
          - Declined
          - Pending
          - Reversed
  - name: response_code
    description: Código de respuesta del autorizador.
  - name: is_fraud
    description: Etiqueta de fraude (verdad de referencia). No es entrada del agente.
  - name: fraud_score
    description: Puntaje de fraude (verdad de referencia). No es entrada del agente.
  - name: latitude
    description: Latitud de la transacción.
  - name: longitude
    description: Longitud de la transacción.
- name: stg_complaints
  description: 'complaints (PQR) con tipos reales. description y resolution son texto plantilla: no construir clasificación de intención sobre esos campos.'
  columns:
  - name: complaint_id
    description: Identificador único del reclamo (PQR).
    data_tests:
    - not_null
    - unique
  - name: creation_date
    description: Fecha de creación del reclamo.
  - name: process_date
    description: Fecha en que el banco procesó la transacción (nunca posterior a un día de la transacción).
  - name: customer_id
    description: Identificador del cliente (clave en customers; referencia en el resto de tablas).
    data_tests:
    - not_null
    - relationships:
        arguments:
          to: ref('stg_customers')
          field: customer_id
  - name: case_type
    description: Tipo de caso.
    data_tests:
    - accepted_values:
        arguments:
          values:
          - Complaint
          - Claim
          - Request
          - Suggestion
  - name: category
    description: Categoría del reclamo.
    data_tests:
    - accepted_values:
        arguments:
          values:
          - Transactions
          - Fees
          - Technical
          - Branch
          - Service
  - name: subcategory
    description: Subcategoría del reclamo.
  - name: reception_channel
    description: Canal por el que se recibió el reclamo.
  - name: affected_product_id
    description: 'DEFECTO CONOCIDO: apunta al producto de otro cliente en el 100% de los casos. Ver tests/assert_complaint_affected_product_belongs_to_customer.sql. No usar para mostrar ni autorizar información de producto.'
  - name: related_branch_id
    description: Sucursal relacionada con el reclamo.
    data_tests:
    - relationships:
        arguments:
          to: ref('stg_branches')
          field: branch_id
  - name: origin_interaction_id
    description: Interacción de call center que originó el reclamo.
  - name: description
    description: Descripción del reclamo en texto libre (plantilla, no señal real).
  - name: claimed_amount
    description: Monto que reclama el cliente.
  - name: currency
    description: Moneda del monto reclamado.
  - name: priority
    description: Prioridad asignada al reclamo.
  - name: status
    description: Estado del reclamo.
    data_tests:
    - accepted_values:
        arguments:
          values:
          - Open
          - In Process
          - Escalated
          - Resolved
          - Closed
          - Rejected
  - name: assigned_agent_id
    description: Agente al que se asignó el reclamo.
    data_tests:
    - relationships:
        arguments:
          to: ref('stg_service_agents')
          field: agent_id
  - name: assignment_date
    description: Fecha en que se asignó el reclamo a un agente.
  - name: first_response_date
    description: Fecha de la primera respuesta al reclamo.
  - name: resolution_date
    description: Fecha de resolución; nula si el reclamo sigue abierto.
  - name: closing_date
    description: Fecha de cierre del reclamo.
  - name: sla_breached
    description: Se incumplió el plazo de servicio comprometido.
  - name: resolution_days
    description: Días transcurridos entre la creación y la resolución.
  - name: resolution
    description: Tipo de resolución del reclamo.
  - name: compensation_granted
    description: Monto compensado al cliente.
  - name: resolution_satisfaction
    description: Satisfacción del cliente con la resolución.
  - name: is_repeat_complainer
    description: El cliente ya había presentado reclamos antes.
- name: stg_call_center_interactions
  description: call_center_interactions con tipos reales. contact_reason == reason_category en la práctica (ver spec/DATA_FINDINGS.md).
  columns:
  - name: interaction_id
    description: Identificador único de la interacción de call center.
    data_tests:
    - not_null
    - unique
  - name: interaction_date
    description: Fecha y hora de la interacción.
  - name: process_date
    description: Fecha en que el banco procesó la transacción (nunca posterior a un día de la transacción).
  - name: customer_id
    description: Identificador del cliente (clave en customers; referencia en el resto de tablas).
    data_tests:
    - not_null
    - relationships:
        arguments:
          to: ref('stg_customers')
          field: customer_id
  - name: agent_id
    description: Identificador del agente de servicio.
    data_tests:
    - relationships:
        arguments:
          to: ref('stg_service_agents')
          field: agent_id
  - name: interaction_type
    description: Tipo de interacción.
  - name: channel
    description: Canal de la interacción.
  - name: contact_reason
    description: Motivo del contacto.
  - name: reason_category
    description: Categoría del motivo del reclamo.
    data_tests:
    - accepted_values:
        arguments:
          values:
          - Transaccional
          - Producto
          - Queja
          - Técnico
          - Comercial
          - Retención
  - name: duration_seconds
    description: Duración en segundos.
  - name: wait_time_seconds
    description: Tiempo de espera antes de ser atendido, en segundos.
  - name: was_resolved
    description: La interacción quedó resuelta.
  - name: requires_followup
    description: El reclamo requiere seguimiento.
  - name: detected_sentiment
    description: Sentimiento detectado en el texto.
  - name: sentiment_score
    description: Puntaje de sentimiento de la interacción.
  - name: customer_detected_accent
    description: Acento detectado en el cliente.
  - name: agent_used_accent
    description: Acento usado por el agente.
  - name: was_escalated
    description: La interacción se escaló.
  - name: mentioned_products
    description: Productos mencionados en la conversación.
  - name: has_transcript
    description: Existe transcripción de la llamada.
  - name: has_recording
    description: Existe grabación de la llamada.
- name: stg_branches
  description: Sucursales. Dimensión que habilita las pruebas de clave foránea a sucursal.
  columns:
  - name: branch_id
    description: Identificador de la sucursal.
    data_tests:
    - not_null
    - unique
  - name: branch_code
    description: Código corto de la sucursal.
  - name: branch_name
    description: Nombre de la sucursal.
  - name: branch_type
    description: Tipo de sucursal.
    data_tests:
    - accepted_values:
        arguments:
          values:
          - Corporate
          - Express
          - Main
          - Premium
  - name: address
    description: Dirección postal.
  - name: city
    description: Ciudad de la sucursal.
  - name: state
    description: Estado o departamento de la sucursal.
  - name: country
    description: País de la sucursal.
    data_tests:
    - accepted_values:
        arguments:
          values:
          - México
          - Colombia
          - Argentina
  - name: postal_code
    description: Código postal.
  - name: geographic_zone
    description: Zona geográfica de la sucursal.
  - name: phone
    description: Teléfono de la sucursal.
  - name: email
    description: Correo electrónico (ficticio).
  - name: opening_time
    description: Hora de apertura de la sucursal.
  - name: closing_time
    description: Hora de cierre de la sucursal.
  - name: has_atms
    description: La sucursal tiene cajeros automáticos.
  - name: atm_count
    description: Cantidad de cajeros automáticos.
  - name: has_teller_windows
    description: La sucursal tiene ventanillas de atención.
  - name: teller_window_count
    description: Cantidad de ventanillas de atención.
  - name: latitude
    description: Latitud de la sucursal.
    data_tests:
    - accepted_range:
        arguments:
          min_value: -90
          max_value: 90
  - name: longitude
    description: Longitud de la sucursal.
    data_tests:
    - accepted_range:
        arguments:
          min_value: -180
          max_value: 180
  - name: branch_opening_date
    description: Fecha de apertura de la sucursal.
  - name: branch_status
    description: Estado de la sucursal.
    data_tests:
    - accepted_values:
        arguments:
          values:
          - Active
          - Temporarily Closed
- name: stg_service_agents
  description: Agentes de servicio. country_of_origin se conforma a 'México'. 129 hablan portugués.
  columns:
  - name: agent_id
    description: Identificador del agente de servicio.
    data_tests:
    - not_null
    - unique
  - name: employee_code
    description: Código interno del empleado.
  - name: first_name
    description: Nombre del cliente (ficticio).
  - name: last_name
    description: Apellido del cliente (ficticio).
  - name: email
    description: Correo electrónico (ficticio).
  - name: phone
    description: Teléfono del agente.
  - name: native_accent
    description: Acento nativo del agente.
    data_tests:
    - accepted_values:
        arguments:
          values:
          - argentine
          - colombian
          - mexican
  - name: country_of_origin
    description: País de origen.
    data_tests:
    - accepted_values:
        arguments:
          values:
          - México
          - Colombia
          - Argentina
  - name: assigned_branch_id
    description: 'DEFECTO CONOCIDO: 831 de 833 con valor no existen en branches. La advertencia mide el defecto.'
    data_tests:
    - relationships:
        arguments:
          to: ref('stg_branches')
          field: branch_id
        config:
          severity: warn
  - name: agent_type
    description: Tipo de agente.
    data_tests:
    - accepted_values:
        arguments:
          values:
          - Digital
          - Hybrid
          - In-Person
          - Phone
  - name: experience_level
    description: Nivel de experiencia del agente.
    data_tests:
    - accepted_values:
        arguments:
          values:
          - Junior
          - Mid-Senior
          - Senior
          - Specialist
  - name: languages
    description: Idiomas que atiende el agente.
  - name: specialty
    description: Especialidad del agente.
  - name: hire_date
    description: Fecha de contratación del agente.
  - name: avg_csat
    description: Satisfacción promedio (CSAT) del agente.
  - name: total_monthly_interactions
    description: Total mensual de interacciones atendidas por el agente.
  - name: agent_status
    description: Estado del agente.
    data_tests:
    - accepted_values:
        arguments:
          values:
          - Active
          - Inactive
          - Leave
          - Vacation
  - name: work_shift
    description: Turno de trabajo del agente.
    data_tests:
    - accepted_values:
        arguments:
          values:
          - Afternoon
          - Morning
          - Night
          - Rotating
- name: stg_marketing_campaigns
  description: Campañas de marketing. Sin uso en atención al cliente; se modela para tener contrato y tests.
  columns:
  - name: campaign_id
    description: Identificador de la campaña de marketing.
    data_tests:
    - not_null
    - unique
  - name: campaign_name
    description: Nombre de la campaña.
  - name: description
    description: Descripción de la campaña.
  - name: campaign_type
    description: Tipo de campaña.
    data_tests:
    - accepted_values:
        arguments:
          values:
          - Email
          - Mix
          - Push
          - SMS
          - Voice
          - WhatsApp
  - name: campaign_objective
    description: Objetivo de la campaña.
    data_tests:
    - accepted_values:
        arguments:
          values:
          - Acquisition
          - Cross-sell
          - Reactivation
          - Retention
          - Up-sell
  - name: promoted_product
    description: Producto promocionado.
  - name: target_segment
    description: Segmento de clientes objetivo.
  - name: target_country
    description: País objetivo.
    data_tests:
    - accepted_values:
        arguments:
          values:
          - México
          - Colombia
          - Argentina
  - name: start_date
    description: Fecha de inicio.
  - name: end_date
    description: Fecha de fin.
  - name: budget
    description: Presupuesto de la campaña.
  - name: campaign_status
    description: Estado de la campaña.
    data_tests:
    - accepted_values:
        arguments:
          values:
          - Active
          - Completed
          - Paused
  - name: expected_conversion_rate
    description: Tasa de conversión esperada.
- name: stg_daily_exchange_rates
  description: Tipo de cambio diario. Incluye MXN aunque ningún producto ni transacción esté en MXN. La columna origen `date` es rate_date.
  data_tests:
  - unique_combination:
      arguments:
        column_names:
        - rate_date
        - source_currency
        - target_currency
  columns:
  - name: rate_date
    description: Fecha de la tasa de cambio.
  - name: source_currency
    description: Moneda de origen de la tasa.
    data_tests:
    - accepted_values:
        arguments:
          values:
          - ARS
          - COP
          - MXN
          - USD
  - name: target_currency
    description: Moneda de destino de la tasa.
    data_tests:
    - accepted_values:
        arguments:
          values:
          - ARS
          - COP
          - MXN
          - USD
  - name: exchange_rate
    description: Tasa de cambio del día.
    data_tests:
    - accepted_range:
        arguments:
          min_value: 1.0e-06
  - name: buy_rate
    description: Tasa de compra.
  - name: sell_rate
    description: Tasa de venta.
  - name: source
    description: Fuente de la tasa de cambio.
- name: stg_call_transcripts
  description: 'Transcripciones. Texto plantilla, 100% español: no sirve para entrenar intención ni valida portugués.'
  columns:
  - name: transcript_id
    description: Identificador único de la transcripción de llamada.
    data_tests:
    - not_null
    - unique
  - name: interaction_id
    description: Identificador único de la interacción de call center.
    data_tests:
    - not_null
    - relationships:
        arguments:
          to: ref('stg_call_center_interactions')
          field: interaction_id
  - name: process_date
    description: Fecha en que el banco procesó la transacción (nunca posterior a un día de la transacción).
  - name: customer_id
    description: Identificador del cliente (clave en customers; referencia en el resto de tablas).
    data_tests:
    - not_null
    - relationships:
        arguments:
          to: ref('stg_customers')
          field: customer_id
  - name: agent_id
    description: Identificador del agente de servicio.
    data_tests:
    - not_null
    - relationships:
        arguments:
          to: ref('stg_service_agents')
          field: agent_id
  - name: full_text
    description: Texto completo de la conversación.
  - name: customer_text
    description: Texto dicho por el cliente.
  - name: agent_text
    description: Texto dicho por el agente.
  - name: detected_language
    description: 'Hoy solo ''es''. Si aparece otro idioma la advertencia avisa: cambiaría lo que se reporta sobre cobertura de portugués.'
    data_tests:
    - accepted_values:
        arguments:
          values:
          - es
        config:
          severity: warn
  - name: detected_accent
    description: Acento regional detectado a partir de la voz del cliente.
  - name: accent_confidence
    description: Confianza de la detección de acento.
  - name: detected_keywords
    description: Palabras clave detectadas.
  - name: mentioned_entities
    description: Entidades mencionadas en la conversación.
  - name: detected_intents
    description: Intenciones detectadas en la conversación.
  - name: main_topics
    description: Temas principales de la conversación.
    data_tests:
    - accepted_values:
        arguments:
          values:
          - Comercial
          - Producto
          - Queja
          - Retención
          - Técnico
          - Transaccional
  - name: transcription_model
    description: Modelo que generó la transcripción.
    data_tests:
    - accepted_values:
        arguments:
          values:
          - AWS Transcribe
          - Azure Speech
          - Google STT
          - Whisper v3
  - name: audio_quality
    description: Calidad del audio de la llamada.
  - name: duration_seconds
    description: Duración en segundos.
- name: stg_satisfaction_surveys
  description: Encuestas. main_score de 1 a 7 para CSAT, NPS y CES; nps_category nunca trae Promoter.
  columns:
  - name: survey_id
    description: Identificador único de la encuesta de satisfacción.
    data_tests:
    - not_null
    - unique
  - name: survey_date
    description: Fecha de la encuesta.
  - name: process_date
    description: Fecha en que el banco procesó la transacción (nunca posterior a un día de la transacción).
  - name: interaction_id
    description: Identificador único de la interacción de call center.
    data_tests:
    - not_null
    - relationships:
        arguments:
          to: ref('stg_call_center_interactions')
          field: interaction_id
  - name: customer_id
    description: Identificador del cliente (clave en customers; referencia en el resto de tablas).
    data_tests:
    - not_null
    - relationships:
        arguments:
          to: ref('stg_customers')
          field: customer_id
  - name: agent_id
    description: Identificador del agente de servicio.
    data_tests:
    - not_null
    - relationships:
        arguments:
          to: ref('stg_service_agents')
          field: agent_id
  - name: survey_type
    description: Tipo de encuesta.
    data_tests:
    - accepted_values:
        arguments:
          values:
          - CES
          - CSAT
          - NPS
  - name: send_channel
    description: Canal del envío.
  - name: main_score
    description: Puntaje principal de la encuesta.
    data_tests:
    - accepted_range:
        arguments:
          min_value: 1
          max_value: 7
  - name: nps_category
    description: Categoría NPS (promotor, pasivo o detractor).
