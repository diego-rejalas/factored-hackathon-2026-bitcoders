version: 2

models:
  - name: customers
    description: "Lo que lee backend/ para consultas de cliente."
    config:
      contract:
        enforced: true
    columns:
      - name: customer_id
        data_type: character varying
        constraints:
          - type: primary_key
        data_tests: [not_null, unique]
      - name: document_number
        data_type: text
      - name: document_type
        data_type: text
      - name: first_name
        data_type: character varying
      - name: last_name
        data_type: character varying
      - name: date_of_birth
        data_type: date
      - name: gender
        data_type: text
      - name: email
        data_type: text
      - name: mobile_phone
        data_type: text
      - name: landline_phone
        data_type: text
      - name: address
        data_type: text
      - name: city
        data_type: character varying
      - name: state
        data_type: character varying
      - name: country
        data_type: character varying
      - name: postal_code
        data_type: text
      - name: detected_accent
        data_type: text
      - name: segment
        data_type: character varying
      - name: credit_score
        data_type: integer
      - name: estimated_monthly_income
        data_type: numeric(12,2)
      - name: occupation
        data_type: text
      - name: marital_status
        data_type: text
      - name: education_level
        data_type: text
      - name: registration_date
        data_type: timestamp without time zone
      - name: registration_branch_id
        data_type: character varying
      - name: customer_status
        data_type: character varying
      - name: last_updated
        data_type: timestamp without time zone
      - name: accepts_marketing
        data_type: boolean

  - name: products
    description: "Lo que lee backend/ para consultas de producto/tarjeta/cuenta."
    config:
      contract:
        enforced: true
    columns:
      - name: product_id
        data_type: character varying
        constraints:
          - type: primary_key
        data_tests: [not_null, unique]
      - name: customer_id
        data_type: character varying
      - name: product_type
        data_type: character varying
      - name: product_number
        data_type: character varying
      - name: currency
        data_type: character varying
      - name: current_balance
        data_type: numeric(15,2)
      - name: credit_limit
        data_type: numeric(15,2)
      - name: interest_rate
        data_type: numeric(5,2)
      - name: opening_date
        data_type: date
      - name: expiration_date
        data_type: date
      - name: opening_branch_id
        data_type: character varying
      - name: product_status
        data_type: character varying
      - name: opening_channel
        data_type: character varying
      - name: has_linked_app
        data_type: boolean
      - name: days_past_due
        data_type: integer
      - name: last_transaction_date
        data_type: timestamp without time zone
      - name: last_updated
        data_type: timestamp without time zone

  - name: transactions
    description: "Lo que lee backend/. is_fraud/fraud_score excluidos deliberadamente — no son input del agente. El contrato impide que vuelvan a entrar por accidente: una columna nueva no declarada aquí rompe la construcción."
    config:
      contract:
        enforced: true
    columns:
      - name: transaction_id
        data_type: character varying
        constraints:
          - type: primary_key
        data_tests: [not_null, unique]
      - name: transaction_date
        data_type: timestamp without time zone
      - name: process_date
        data_type: date
      - name: product_id
        data_type: character varying
      - name: customer_id
        data_type: character varying
      - name: transaction_type
        data_type: character varying
      - name: transaction_category
        data_type: character varying
      - name: amount
        data_type: numeric(15,2)
      - name: currency
        data_type: character varying
      - name: amount_usd
        data_type: numeric(15,2)
      - name: channel
        data_type: character varying
      - name: branch_id
        data_type: text
      - name: merchant_name
        data_type: text
      - name: merchant_category
        data_type: text
      - name: transaction_country
        data_type: character varying
      - name: transaction_city
        data_type: text
      - name: transaction_status
        data_type: character varying
      - name: response_code
        data_type: text
      - name: latitude
        data_type: numeric(10,7)
      - name: longitude
        data_type: numeric(10,7)

  - name: complaints
    description: "Lo que lee backend/ si el workflow elegido es disputas (Opción A)."
    config:
      contract:
        enforced: true
    columns:
      - name: complaint_id
        data_type: character varying
        constraints:
          - type: primary_key
        data_tests: [not_null, unique]
      - name: creation_date
        data_type: timestamp without time zone
      - name: process_date
        data_type: date
      - name: customer_id
        data_type: character varying
      - name: case_type
        data_type: character varying
      - name: category
        data_type: character varying
      - name: subcategory
        data_type: text
      - name: reception_channel
        data_type: character varying
      - name: affected_product_id
        data_type: text
      - name: related_branch_id
        data_type: text
      - name: origin_interaction_id
        data_type: text
      - name: description
        data_type: character varying
      - name: claimed_amount
        data_type: numeric(15,2)
      - name: currency
        data_type: text
      - name: priority
        data_type: character varying
      - name: status
        data_type: character varying
      - name: assigned_agent_id
        data_type: text
      - name: assignment_date
        data_type: timestamp without time zone
      - name: first_response_date
        data_type: timestamp without time zone
      - name: resolution_date
        data_type: timestamp without time zone
      - name: closing_date
        data_type: timestamp without time zone
      - name: sla_breached
        data_type: boolean
      - name: resolution_days
        data_type: integer
      - name: resolution
        data_type: text
      - name: compensation_granted
        data_type: numeric(15,2)
      - name: resolution_satisfaction
        data_type: integer
      - name: is_repeat_complainer
        data_type: boolean

  - name: call_center_interactions
    description: "Contexto de interacciones previas — soporte, no núcleo de ningún workflow por sí solo."
    config:
      contract:
        enforced: true
    columns:
      - name: interaction_id
        data_type: character varying
        constraints:
          - type: primary_key
        data_tests: [not_null, unique]
      - name: interaction_date
        data_type: timestamp without time zone
      - name: process_date
        data_type: date
      - name: customer_id
        data_type: character varying
      - name: agent_id
        data_type: text
      - name: interaction_type
        data_type: character varying
      - name: channel
        data_type: character varying
      - name: contact_reason
        data_type: character varying
      - name: reason_category
        data_type: character varying
      - name: duration_seconds
        data_type: integer
      - name: wait_time_seconds
        data_type: integer
      - name: was_resolved
        data_type: boolean
      - name: requires_followup
        data_type: boolean
      - name: detected_sentiment
        data_type: text
      - name: sentiment_score
        data_type: numeric(3,2)
      - name: customer_detected_accent
        data_type: text
      - name: agent_used_accent
        data_type: text
      - name: was_escalated
        data_type: boolean
      - name: mentioned_products
        data_type: text
      - name: has_transcript
        data_type: boolean
      - name: has_recording
        data_type: boolean
